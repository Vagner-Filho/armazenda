{{ define "navbar" }}
<nav class="fixed top-2 right-2 w-fit px-4 py-1 rounded-xl glass-panel text-center leading-10 print:hidden">
  <div class="ml-auto flex items-center gap-3 w-fit h-full px-2">
    {{ template "user-icon" "text-green-500 size-6 lg:size-7" }}
    <h3 id="username" class="text-white text-lg">...</h3>
    <button type="button"
            hx-post="/logout"
            title="Sair"
            aria-label="Sair"
            data-test_id="logout-btn"
            class="text-gray-300 hover:text-red-400 transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 lg:size-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </button>
  </div>
  <script nonce="{{ .CSPNonce }}" type="module">
    cookieStore.get('username')
      .then((username) => {
        const usernameEl = document.querySelector('nav h3')
        if (usernameEl && username) {
          usernameEl.textContent = username.value.replaceAll("+", " ")
        }
      })
  </script>
</nav>
{{ end }}
