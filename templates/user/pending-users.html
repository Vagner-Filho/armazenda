{{ define "pending-users" }}
<div class="glass-panel rounded-xl p-4 mt-8">
    <h2 class="text-xl font-bold text-white mb-4">Usuários Pendentes</h2>
    {{ if .users }}
    <ul class="space-y-4">
        {{ range .users }}
        <li id="user-{{ .Id }}" class="flex flex-col sm:flex-row sm:items-center justify-between p-4 glass-panel rounded-xl gap-4">
            <div class="text-white/90">
                <p class="font-semibold text-white">{{ .Name }}</p>
                <p class="text-sm text-white/80">{{ .Email }}</p>
                <p class="text-sm text-white/80">CPF: {{ .Cpf }}</p>
            </div>
            <div class="flex items-center gap-2">
                <button hx-post="/user/approve/{{ .Id }}" hx-target="#user-{{ .Id }}" hx-swap="outerHTML"
                    class="primary-glass-btn text-sm">
                    <iconify-icon icon="mdi:check" width="18" height="18"></iconify-icon>
                    Aprovar
                </button>
                <button hx-post="/user/decline/{{ .Id }}" hx-target="#user-{{ .Id }}" hx-swap="outerHTML"
                    class="cancel-btn text-sm">
                    <iconify-icon icon="mdi:close" width="18" height="18"></iconify-icon>
                    Recusar
                </button>
            </div>
        </li>
        {{ end }}
    </ul>
    {{ else }}
    <p class="text-center text-white/70 py-4">Nenhum usuário pendente.</p>
    {{ end }}
</div>
{{ end }}
