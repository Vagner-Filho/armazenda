<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <title>Completar Cadastro - Armazenda</title>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/static/htmx.min.js.gz" defer></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
</head>
<body class="bg-gray-200 h-screen flex justify-center items-center">
    <main class="bg-white p-8 w-full max-w-lg rounded shadow-lg">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-700">Completar Cadastro</h1>
            <p class="text-gray-600 mt-2">Finalize seu cadastro com {{ .ProviderName }} informando os dados obrigatórios.</p>
        </header>

        <form hx-post="{{ .PostUrl }}" hx-vals='{"role": "user"}' hx-swap="none" class="flex flex-col gap-4">
            <fieldset class="flex flex-col gap-2 p-4 bg-gray-50 rounded-lg border border-gray-200">
                <legend class="text-sm font-bold text-gray-500 uppercase tracking-wide px-2">Identificação {{ .ProviderName }}</legend>

                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" value="{{ .Name }}" readonly class="w-full px-3 py-2 bg-gray-200 border border-gray-300 rounded text-gray-600 cursor-not-allowed">
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" value="{{ .Email }}" readonly class="w-full px-3 py-2 bg-gray-200 border border-gray-300 rounded text-gray-600 cursor-not-allowed">
                </div>
            </fieldset>

            <fieldset class="flex flex-col gap-2 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
                <legend class="text-sm font-bold text-green-600 uppercase tracking-wide px-2">Dados Adicionais</legend>

                {{ template "cpf-field" . }}

                <div class="flex flex-col-reverse mt-2">
                    <input type="text" id="ownerDocument" required class="peer w-full px-2" name="ownerDocument" placeholder="CPF ou CNPJ do proprietário">
                    <label for="ownerDocument" class="label-peer">CPF/CNPJ do Proprietário</label>
                </div>
                <div class="flex flex-col-reverse mt-2">
                    <select id="ownerDocumentType" required class="peer w-full px-2" name="ownerDocumentType">
                        <option value="1" selected>CPF</option>
                        <option value="2">CNPJ</option>
                    </select>
                    <label for="ownerDocumentType" class="label-peer">Tipo de Documento</label>
                </div>
                <div class="flex flex-col-reverse mt-2">
                    <input type="text" id="inscEstadual" required class="peer w-full px-2" name="inscricaoEstadual" placeholder="Inscrição Estadual Principal">
                    <label for="inscEstadual" class="label-peer">Inscrição Estadual Principal</label>
                </div>
                <div id="additional-ies-container" class="flex flex-col gap-2"></div>
                <button type="button" id="add-ie-btn" class="text-sm text-green-600 hover:text-green-500 transition-colors text-left">
                    + Adicionar outra Inscrição Estadual
                </button>
            </fieldset>

            <fieldset class="flex flex-col gap-2 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
                <legend class="text-sm font-bold text-green-600 uppercase tracking-wide px-2">Senha de Acesso</legend>
                <p class="text-xs text-gray-500 mb-2">Defina uma senha para acessar também via CPF.</p>

                <div class="flex flex-col-reverse">
                    <input type="password" id="passwd" required class="peer w-full px-2" name="passwd" placeholder="********">
                    <label for="passwd" class="label-peer">Senha</label>
                </div>

                <div class="flex flex-col-reverse mt-2">
                    <input type="password" id="passwdConfirm" required class="peer w-full px-2" name="passwdConfirm" placeholder="********">
                    <label for="passwdConfirm" class="label-peer">Confirme a senha</label>
                </div>
            </fieldset>

            <div class="flex items-center justify-between mt-4">
                <a href="/" class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors">Cancelar</a>
                <button type="submit" class="add-btn">Finalizar Cadastro</button>
            </div>
        </form>
    </main>
    <script nonce="{{ .CSPNonce }}" type="module">
        const addIeBtn = document.getElementById('add-ie-btn');
        const ieContainer = document.getElementById('additional-ies-container');
        let ieCount = 0;
        if (addIeBtn && ieContainer) {
            addIeBtn.addEventListener('click', () => {
                ieCount++;
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col-reverse mt-2';
                wrapper.innerHTML = `
                    <input type="text" id="additionalIE${ieCount}" class="peer w-full px-2" name="additionalIEs"
                        placeholder="Inscrição Estadual ${ieCount + 1}">
                    <label for="additionalIE${ieCount}" class="label-peer">Inscrição Estadual Adicional ${ieCount}</label>
                `;
                ieContainer.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
