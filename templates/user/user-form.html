{{ define "user-form" }}
<dialog id="new-user-dialog">
  <form hx-post="/user" class="p-6 sm:w-[500px] lg:w-[600px]">
    {{ template "close-dialog-btn" "dialog#new-user-dialog" }}
    <fieldset>
      <legend class="mx-auto">
        <h1 class="sm:text-lg lg:text-xl">
          Nova Conta
        </h1>
      </legend>
      <div class="flex flex-col-reverse py-1">
        <input type="text" id="name" required class="peer px-2" name="name" aria-placeholder="Nome">
        <label for="name" class="label-peer">Nome</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input
          type="text"
          id="cpf"
          name="cpf"
          class="peer px-2"
          placeholder="000.000.000-00"
          required
          maxlength="14"
          pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
          title="Digite o CPF no formato 000.000.000-00"
          oninput="formatCPF(this)"
        >
        <label for="cpf" class="label-peer">CPF</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input type="email" id="email" required class="peer px-2" name="email" aria-placeholder="email de cadastro">
        <label for="email" class="label-peer">E-mail</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input type="password" id="passwd" required class="peer px-2" name="passwd" aria-placeholder="senha de acesso">
        <label for="passwd" class="label-peer">Senha</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input type="password" id="passwdConfim" required class="peer px-2" name="passwdConfirm" aria-placeholder="repita a senha de acesso">
        <label for="passwdConfirm" class="label-peer">Confirme a senha</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input type="text" id="inscEstadual" required class="peer px-2" name="inscricaoEstadual" aria-placeholder="inscrição estadual">
        <label for="inscEstadual" class="label-peer">Inscrição Estadual</label>
      </div>
    </fieldset>
    <fieldset class="text-center w-full pt-2">
      <button type="button" class="cancel-btn" onclick="closeUserForm()">Cancelar</button>
      <button type="submit" class="add-btn">Cadastrar</button>
    </fieldset>
  </form>
  <script type="module">
    const dialog = document.querySelector("dialog#new-user-dialog");
        if (dialog) {
            dialog.showModal();
            window.closeUserForm = function() {
                dialog.close();
                window.closeUserForm = undefined;
            }
        }
    document.body.addEventListener('htmx:configRequest', function(evt) {
        evt.detail.parameters['cpf'] = evt.detail.parameters['cpf'].replace(/\D/g, '');
    });
  </script>
  <script>
    /**
         * Formats the input value to the Brazilian CPF format (XXX.XXX.XXX-XX)
         * as the user types.
         * @param {HTMLInputElement} inputElement - The input element to format.
         */
        function formatCPF(inputElement) {
            // 1. Get the raw value and remove non-digit characters
            let value = inputElement.value.replace(/\D/g, '');

            // 2. Limit to 11 digits (maximum length of a CPF without formatting)
            value = value.substring(0, 11);

            // 3. Apply the formatting mask
            let formattedValue = '';
            if (value.length > 9) {
                // Format: XXX.XXX.XXX-XX
                formattedValue = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                // Format: XXX.XXX.XXX
                formattedValue = value.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
            } else if (value.length > 3) {
                // Format: XXX.XXX
                formattedValue = value.replace(/(\d{3})(\d{3})/, '$1.$2');
            } else {
                // Format: XXX
                formattedValue = value;
            }

            // 4. Update the input field's value
            inputElement.value = formattedValue;
        }
  </script>
</dialog>
{{ end }}
