{{ define "user-list-item" }}
<tr id="user-row-{{ .user.Id }}" class="border-b border-white/10 hover:bg-white/5 {{ if not .user.IsActive }}opacity-50{{ end }}">
    <td class="py-3 px-4" data-label="Nome">{{ .user.Name }}</td>
    <td class="py-3 px-4" data-label="Email">{{ .user.Email }}</td>
    <td class="py-3 px-4" data-label="CPF">{{ .user.Cpf }}</td>
    <td class="py-3 px-4" data-label="Função">
        {{ if eq .user.Role "admin" }}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/30 text-blue-200 border border-blue-400/30">
            Administrador
        </span>
        {{ else }}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-white/10 text-white/90 border border-white/20">
            Usuário
        </span>
        {{ end }}
    </td>
    {{ if .isAdmin }}
    <td class="py-3 px-4" data-label="Ações">
        <div class="flex flex-wrap gap-2">
            {{ if not .user.IsActive }}
            <button hx-post="/user/{{ .user.Id }}/activate" 
                    hx-target="#user-row-{{ .user.Id }}" 
                    hx-swap="outerHTML"
                    hx-confirm="Tem certeza que deseja ativar este usuário?"
                    class="glass-btn text-xs flex items-center gap-1">
                <iconify-icon icon="mdi:account-check" width="16" height="16"></iconify-icon>
                Ativar
            </button>
            {{ else }}
            {{ if eq .user.Role "user" }}
            <button hx-post="/user/{{ .user.Id }}/make-admin" 
                    hx-target="#user-row-{{ .user.Id }}" 
                    hx-swap="outerHTML"
                    class="glass-btn text-xs flex items-center gap-1 bg-blue-500/20 border-blue-400/30 hover:bg-blue-500/30">
                <iconify-icon icon="mdi:shield-crown" width="16" height="16"></iconify-icon>
                Tornar Admin
            </button>
            {{ else }}
            <button hx-post="/user/{{ .user.Id }}/remove-admin" 
                    hx-target="#user-row-{{ .user.Id }}" 
                    hx-swap="outerHTML"
                    class="glass-btn text-xs flex items-center gap-1">
                <iconify-icon icon="mdi:shield-off" width="16" height="16"></iconify-icon>
                Remover Admin
            </button>
            {{ end }}
            <button hx-delete="/user/{{ .user.Id }}" 
                    hx-target="#user-row-{{ .user.Id }}" 
                    hx-swap="outerHTML"
                    hx-confirm="Tem certeza que deseja remover o acesso deste usuário?"
                    class="cancel-btn text-xs flex items-center gap-1">
                <iconify-icon icon="mdi:account-remove" width="16" height="16"></iconify-icon>
                Remover
            </button>
            {{ end }}
        </div>
    </td>
    {{ end }}
</tr>
{{ end }}
