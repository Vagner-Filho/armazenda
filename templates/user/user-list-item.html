{{ define "user-list-item" }}
<tr id="user-row-{{ .user.Id }}" class="{{ if not .user.IsActive }}line-through opacity-50{{ end }}">
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ .user.Name }}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ .user.Email }}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ .user.Cpf }}</td>
    <td class="px-6 py-4 whitespace-nowrap">
        {{ if eq .user.Role "admin" }}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
            Administrador
        </span>
        {{ else }}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
            Usuário
        </span>
        {{ end }}
    </td>
    {{ if .isAdmin }}
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
        {{ if not .user.IsActive }}
        <button hx-post="/user/{{ .user.Id }}/activate" 
                hx-target="#user-row-{{ .user.Id }}" 
                hx-swap="outerHTML"
                hx-confirm="Tem certeza que deseja ativar este usuário?"
                class="inline-flex items-center px-3 py-1 border border-transparent text-xs font-medium rounded text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
            Ativar Usuário
        </button>
        {{ else }}
        {{ if eq .user.Role "user" }}
        <button hx-post="/user/{{ .user.Id }}/make-admin" 
                hx-target="#user-row-{{ .user.Id }}" 
                hx-swap="outerHTML"
                class="inline-flex items-center px-3 py-1 border border-transparent text-xs font-medium rounded text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Tornar Admin
        </button>
        {{ else }}
        <button hx-post="/user/{{ .user.Id }}/remove-admin" 
                hx-target="#user-row-{{ .user.Id }}" 
                hx-swap="outerHTML"
                class="inline-flex items-center px-3 py-1 border border-transparent text-xs font-medium rounded text-white bg-yellow-600 hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">
            Remover Admin
        </button>
        {{ end }}
        <button hx-delete="/user/{{ .user.Id }}" 
                hx-target="#user-row-{{ .user.Id }}" 
                hx-swap="outerHTML"
                hx-confirm="Tem certeza que deseja remover o acesso deste usuário?"
                class="inline-flex items-center px-3 py-1 border border-transparent text-xs font-medium rounded text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
            Remover Acesso
        </button>
        {{ end }}
    </td>
    {{ end }}
</tr>
{{ end }}
