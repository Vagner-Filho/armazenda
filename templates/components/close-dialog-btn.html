{{ block "close-dialog-btn" . }}
<button type="button" class="close-dialog-btn" id="close-dialog-{{ .selector }}">
    &times;
</button>
<script nonce="{{ .CSPNonce }}" type="module">
    import { closeModal } from "/public/assets/js/utils.js";
    document.getElementById('close-dialog-{{ .selector }}').addEventListener('click', () => closeModal('{{ .selector }}'));
</script>
{{ end }}
