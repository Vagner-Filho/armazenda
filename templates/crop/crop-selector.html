{{ block "crop-selector" $ }}
<div class="flex flex-col w-full relative pr-[30px]">
  <label for="crop-selector" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear text-xs lg:text-sm font-medium uppercase tracking-wider">
    Safra
  </label>
  <select name="crop" id="crop-selector" class="w-full bg-white/10 border-white/20 text-white peer" required>
    {{ range $.Crops }}
            {{ if eq .Id $.SelectedCrop }}
                <option value="{{ .Id }}" selected data-product-id="{{ .Product }}">
                  {{ .Name }}
                </option>
            {{ else }}
                <option value="{{ if ne .Id nil }}{{ .Id }}{{ end }}" data-product-id="{{ .Product }}">
                  {{ .Name }}
                </option>
            {{ end }}
         {{ else }}
    <option value="-1">
      Nenhuma safra encontrada
    </option>
    {{ end }}
  </select>
  <button class="icon-btn absolute right-0 bottom-2 text-[24px]" type="button" hx-get="/crop/form" hx-target="body" hx-swap="beforeend">
    <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
  </button>
</div>
{{ end }}
