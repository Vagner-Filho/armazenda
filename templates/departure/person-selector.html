{{ block "person-selector" $ }}
<select name="origin" id="person-selector" class="w-full peer">
  {{ if eq $.SelectedPerson 0 }}
  <option value="">
    Própria
  </option>
  {{ end }}
  {{ range $.People }}
  {{ if eq .Id $.SelectedPerson }}
  {{ template "selected-option" . }}
  {{ else }}
  {{ template "simple-option" . }}
  {{ end }}
  {{ else }}
  <option value="-1">
    Nenhuma pessoa encontrada
  </option>
  {{ end }}
</select>
{{ end }}
