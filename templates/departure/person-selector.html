{{ block "person-selector" $ }}
<select name="origin" id="person-selector" class="w-full peer">
  {{ range $.People }}
  <option
    {{ if eq .Id nil }} value="" {{ else }} value="{{ .Id }}" {{ end }} data-humidity="{{ .HumidityDiscount }}"
    {{ if eq .Id $.SelectedPerson }} selected {{ end }}>
    {{ .Name }}
  </option>
  {{ else }}
  <option value="-1">
    Nenhuma pessoa encontrada
  </option>
  {{ end }}
</select>
{{ end }}
