{{ block "departure-filter-form" . }}
<form class="flex flex-col sm:flex-row flex-wrap items-start gap-1 justify-start" id="departure-filters-form"
  hx-post="/departure/filter" hx-target="main#list">
  {{ template "filter-departure-date" }}
  {{ template "person-filter" .People }}
  {{ template "filter-entry-vehicle" .Vehicles }}
  {{ template "filter-entry-grain" }}
  {{ template "filter-departure-weight" }}
  <script type="module">
    document.body.addEventListener('htmx:configRequest', function (evt) {
      if (evt.detail.parameters.person && evt.detail.parameters.person === 'null') {
        delete evt.detail.parameters.person
      }
    });
  </script>
</form>
{{ end }}
