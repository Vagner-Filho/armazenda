{{ define "filter-departure-date" }}
<fieldset class="filter-card">
    <legend class="w-full text-center text-xs font-medium uppercase tracking-wider text-white/70">
        Data de saída
    </legend>
    <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
        <input type="datetime-local" id="departureMin" name="departureDateMin" class="text-sm peer w-full bg-white/10 text-white border-white/20" aria-placeholder="Data de saída mínima" />
        <label for="departureMin" class="px-2 text-xs text-white/80 peer-focus:text-green-400">de:</label>
    </div>
    <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
        <input type="datetime-local" id="departureMax" name="departureDateMax" class="text-sm peer w-full bg-white/10 text-white border-white/20" aria-placeholder="Data de saída máxima" />
        <label for="departureMax" class="px-2 text-xs text-white/80 peer-focus:text-green-400">até:</label>
    </div>
</fieldset>
{{ end }}
