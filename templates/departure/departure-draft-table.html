{{ block "departure-draft-table" . }}
<table class="w-full">
    <thead
        class="text-xs sm:text-base whitespace-nowrap bg-gray-100 text-gray-600 uppercase hidden md:table-header-group">
        <tr>
            <th class="py-3 px-4 text-left">
                Nome
            </th>
            <th class="py-3 px-4 text-left">
                Destino
            </th>
            <th class="py-3 px-4 text-left">
                Safra
            </th>
            <th class="py-3 px-4 text-left">
                Placa
            </th>
            <th class="py-3 px-4 text-left">
                Tara
            </th>
            <th class="py-3 px-4 text-left">
                Ações
            </th>
        </tr>
    </thead>
    <tbody id="departures-draft-table-body" class="text-gray-700">
        {{ range . }}
        {{ template "departure-draft-list-item" . }}
        {{ end }}
    </tbody>
</table>
{{ end }}
