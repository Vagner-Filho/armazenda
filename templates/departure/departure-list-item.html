{{ block "departure-list-item" . }}
<tr class="text-sm border-b border-sky-50/30 hover:bg-sky-50/10 whitespace-nowrap" id="departure-{{ .Id }}">
  <td class="py-3 px-4 text-left" data-label="Romaneio">{{ .Id }}</td>
  <td class="py-3 px-4 text-left {{ if eq .Product "Milho" }}text-yellow-300{{ else }}text-emerald-300{{ end }}" data-label="Produto">{{ .Product }}</td>
  <td class="py-3 px-4 text-left truncate max-w-64" data-label="Origem">{{ .Origin }}</td>
  <td class="py-3 px-4 text-left font-mono" data-label="Placa" data-test_id="plate">{{ .VehiclePlate }}</td>
  <td id="netWeight" class="py-3 px-4 text-left font-bold" data-label="Peso" data-test_id="net_weight">{{ .NetWeight }}</td>
  <td id="departureDate" class="py-3 px-4 text-left" data-label="Data de Saída" data-raw="{{ .DepartureDate }}">{{ .DepartureDate }}</td>
  <td class="py-3 px-4 text-left" data-label="Ações">
    <div class="flex items-center justify-end lg:justify-start gap-2 *:size-5">
      <button type="button" id="{{ .Id }}" data-pdf="departure" title="PDF de Saída" class="icon-btn">
        <iconify-icon icon="mdi:file-pdf-box" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-get="/departure/form/{{ .Id }}" hx-target="body" hx-swap="beforeend" title="Editar Saída" class="icon-btn">
        <iconify-icon icon="mdi:pencil" class="text-xl"></iconify-icon>
      </button>
      {{ $canEmitNFe := and (not .OriginID) .RecipientID }}
      <button type="button"
        {{ if $canEmitNFe }}hx-get="/nfe/modal/{{ .Id }}" hx-target="body" hx-swap="beforeend"{{ end }}
        title="{{ if $canEmitNFe }}Emitir NF-e{{ else }}NF-e só pode ser emitida para saídas do tipo Próprio -> Terceiro{{ end }}"
        class="icon-btn{{ if not $canEmitNFe }} opacity-50 cursor-not-allowed{{ end }}"
        {{ if not $canEmitNFe }}disabled{{ end }}>
        <iconify-icon icon="mdi:receipt-text" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-trigger="confirmed" hx-delete="/departure/{{ .Id }}" hx-target="#departure-{{ .Id }}" title="Excluir Saída" hx-swap="delete" class="icon-btn" data-delete-text="Deseja excluir o romaneio de saída {{ .Id }} ?">
        <iconify-icon icon="mdi:trash-can" class="text-xl"></iconify-icon>
      </button>
    </div>
  </td>
</tr>
{{ end }}
