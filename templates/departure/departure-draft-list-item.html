{{ block "departure-draft-list-item" . }}
<tr class="text-sm sm:text-base border-b border-white/10 hover:bg-white/5 whitespace-nowrap" id="departure-draft-{{ .Id }}">
  <td class="py-3 px-4 text-left" data-label="Nome">{{ .Name }}</td>
  <td class="py-3 px-4 text-left" data-label="Destino">{{ .Person }}</td>
  <td class="py-3 px-4 text-left" data-label="Safra">{{ .Crop }}</td>
  <td class="py-3 px-4 text-left" data-label="Placa">{{ .Vehicle }}</td>
  <td class="py-3 px-4 text-left" data-label="Tara">{{ if eq .Tare nil }}N/A{{ else }}{{ .Tare }}{{ end }}</td>
  <td class="py-3 px-4 text-left" data-label="Ações">
    <div class="flex items-center justify-end lg:justify-start gap-2">
      <button type="button" hx-get="/departure/form/draft/{{ .Id }}" hx-target="body" hx-swap="beforeend" title="Gerar Saída a partir do Rascunho" class="icon-btn">
        <iconify-icon icon="mdi:file-document-plus-outline" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-get="/departure/draft/form/{{ .Id }}" hx-target="body" hx-swap="beforeend" title="Editar Rascunho" class="icon-btn">
        <iconify-icon icon="mdi:pencil" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-trigger="confirmed" hx-delete="/departure/draft/{{ .Id }}" hx-target="#departure-draft-{{ .Id }}" hx-swap="delete" title="Excluir Rascunho" class="icon-btn" data-delete-text="Deseja excluir o rascunho {{ .Name }} ?">
        <iconify-icon icon="mdi:trash-can" class="text-xl"></iconify-icon>
      </button>
    </div>
  </td>
</tr>
{{ end }}
