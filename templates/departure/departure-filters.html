{{ block "departure-filters" . }}
<details id="departure-filters" class="group w-full">
    <summary class="outline-none list-none flex items-center justify-between px-3 py-1 cursor-pointer hover:bg-gray-50 rounded-t-lg">
        <span class="text-lg font-medium text-gray-800">Filtros</span>
        <div class="flex items-center gap-2">
            <button type="submit" form="departure-filters-form" class="hidden group-open:flex items-center gap-2 px-3 py-1.5 bg-green-600 text-white rounded-md hover:bg-green-700 transition-all duration-200 text-sm font-medium" title="Filtrar">
                <iconify-icon icon="mingcute:filter-line" width="18" height="18"></iconify-icon>
                <span>Filtrar</span>
            </button>
            <button type="button" hx-trigger="click" hx-get="/departure/filters" hx-target="form#departure-filters-form" hx-swap="outerHTML" class="hidden group-open:flex items-center gap-2 px-3 py-1.5 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-all duration-200 text-sm font-medium" title="Limpar Filtro">
                <iconify-icon icon="hugeicons:clean" width="18" height="18"></iconify-icon>
                <span>Limpar</span>
            </button>
            <svg class="w-5 h-5 text-gray-500 transform transition-transform duration-200 group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </div>
    </summary>
    <div class="p-4 border-t border-gray-200">
        {{ template "departure-filter-form" . }}
    </div>
</details>
{{ end }}
