{{ block "departure-form" . }}
<dialog id="departure-form-dialog" class="rounded-md w-full max-w-3xl bg-stone-100">
    <div class="p-4 relative">
        {{ template "close-dialog-btn" "dialog#departure-form-dialog" }}
        <h1 class="text-center font-medium text-xl">
            Nova Saída
        </h1>
        <form class="flex flex-col gap-4" {{ if .Departure.Id }} hx-put="/departure/{{ .Departure.Id }}"
            hx-target="#departure-{{ .Departure.Id }}" hx-swap="outerHTML" {{ else }} hx-post="/departure"
            hx-target="#departure-table-body" hx-swap="beforeend" {{ end }} hx-indicator="#btns-container">
            <fieldset class="flex flex-col gap-2 p-2 bg-white rounded-lg shadow">
                <legend class="text-lg uppercase rounded-t-lg bg-white px-2 font-light">
                    Identificação
                </legend>
                {{ template "crop-selector" . }}
                {{ template "person-selector" . }}
                <div class="flex flex-col-reverse">
                    <input type="number" name="grossWeight" id="grossWeight" class="peer" {{ if ne
                        .Departure.GrossWeight 0.0 }} value="{{ .Departure.GrossWeight }}" {{ end }} required>
                    <label for="grossWeight" class="label-peer">
                        Peso Bruto
                    </label>
                </div>
                <div class="flex flex-col-reverse">
                    <input type="number" name="tare" id="tare" class="peer" {{ if ne .Departure.Tare 0.0 }}
                        value="{{ .Departure.Tare }}" {{ end }} required>
                    <label for="tare" class="label-peer">
                        Tara
                    </label>
                </div>
                <div class="flex flex-col-reverse">
                    <input type="number" name="netWeight" id="netWeight" class="peer cursor-not-allowed" {{ if ne
                        .Departure.NetWeight 0.0 }} value="{{ .Departure.NetWeight }}" {{ end }} readonly min="0"
                        required>
                    <label for="netWeight" class="label-peer">
                        Peso Líquido (preenchimento automático)
                    </label>
                </div>
            </fieldset>
            <fieldset class="flex flex-col gap-2 p-2 bg-white rounded-lg shadow">
                <legend class="text-lg uppercase rounded-t-lg bg-white px-2 font-light">
                    Saída
                </legend>
                {{ template "vehicle-selector" . }}
                <div class="flex flex-col-reverse">
                    <input type="datetime-local" name="departureDate" id="departure-input" class="peer"
                        value="{{ .Departure.DepartureDate }}" required>
                    <label for="departure-input" class="label-peer">
                        Data de Saída
                    </label>
                </div>
            </fieldset>
            <div class="flex items-center justify-around mt-2 w-52 mx-auto" id="btns-container">
                <button class="cancel-btn" type="button" onclick="closeDepartureForm()">Cancelar</button>
                <button class="add-btn" type="submit">
                    {{ if .Departure.Id }} Editar {{ else }} Adicionar {{ end }}
                </button>
                <img class="htmx-indicator" src="/public/assets/static/spinner.svg" alt="...">
            </div>
        </form>
    </div>

    <script type="module">
        import {formatDateToInput} from "/public/assets/js/date.js"
        const dateVal = formatDateToInput({{ .Departure.DepartureDate}})
        const dialogEl = document.querySelector("#departure-form-dialog")
        if (dialogEl) {
            dialogEl.showModal()

            const departureDateEl = dialogEl.querySelector("input#departure-input")
            if (!!departureDateEl) {
                departureDateEl.setAttribute("value", dateVal)
            }

            function closeDepartureForm() {
                dialogEl.close()
                dialogEl.remove()
            }

            dialogEl.addEventListener('close', closeDepartureForm)
            window.closeDepartureForm = closeDepartureForm

            const grossWeightInput = dialogEl.querySelector('input#grossWeight')
            const tareInput = dialogEl.querySelector('input#tare')

            let grossWeightValue = Number(grossWeightInput ? grossWeightInput.value : 0)
            let tareValue = Number(tareInput ? tareInput.value : 0)

            const netWeightInput = dialogEl.querySelector('input#netWeight')
            if (netWeightInput) {
                grossWeightInput.addEventListener('input', (e) => {
                    grossWeightValue = Number(e.target.value) ?? 0

                    netWeightInput.value = grossWeightValue - tareValue
                })
                tareInput.addEventListener('input', (e) => {
                    tareValue = Number(e.target.value) ?? 0

                    netWeightInput.value = grossWeightValue - tareValue
                })
            }
        }
    </script>
    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request button {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: block
        }
    </style>
</dialog>
{{ end }}
