{{ block "report-list-item" . }}
<tr class="text-sm sm:text-base border-b border-gray-200 hover:bg-gray-50"
  id="operation-{{ .OperationType }}-{{ .Romaneio }}">
  <td class="py-3 px-4 text-left">
    {{ .Romaneio }}
  </td>
  <td class="py-3 px-4 text-left">
    {{ if eq .OperationType 0 }}
    <div title="Entrada" class="flex items-center gap-2">
      <iconify-icon icon="mdi:arrow-bottom-left-thick" class="text-xl text-blue-500"></iconify-icon>
      <span class="font-semibold text-blue-500">Entrada</span>
    </div>
    {{ else }}
    <div title="Saída" class="flex items-center gap-2">
      <iconify-icon icon="mdi:arrow-top-right-thick" class="text-xl text-amber-500"></iconify-icon>
      <span class="font-semibold text-amber-500">Saída</span>
    </div>
    {{ end }}
  </td>
  <td class="py-3 px-4 text-left">
    {{ .Person }}
  </td>
  <td class="py-3 px-4 text-left">
    {{ .Product }}
  </td>
  <td class="py-3 px-4 text-left">
    {{ .Vehicle }}
  </td>
  <td class="py-3 px-4 text-left">
    {{ .NetWeight }}
  </td>
  <td id="operationDate" class="py-3 px-4 text-left">
    ...
  </td>
  <script type="module">
    import {formatDateToDisplay} from "/public/assets/js/date.js"
    const itemRow = document.querySelector("#operation-{{ .OperationType }}-{{ .Romaneio }}")
    if (itemRow) {
      itemRow.querySelector("#operationDate").textContent = formatDateToDisplay({{ .OperationDate}})
    }
  </script>
</tr>
{{ end }}
