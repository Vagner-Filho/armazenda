{{ block "report-list-item" . }}
<tr class="text-center whitespace-nowrap text-sm sm:text-base" id="operation-{{ .OperationType }}-{{ .Romaneio }}">
  <td data-label="Romaneio">
    {{ .Romaneio }}
  </td>
  <td data-label="Operação">
    {{ if eq .OperationType 0 }}
    <div title="Entrada">
      <svg class="mx-auto text-blue-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14"/>
      </svg>
    </div>
    {{ else }}
    <div title="Saída">
      <svg class="mx-auto text-amber-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12h14"/>
      </svg>
    </div>
    {{ end }}
  </td>
  <td data-label="Pessoa">
    {{ .Person }}
  </td>
  <td data-label="Produto">
    {{ .Product }}
  </td>
  <td data-label="Veículo">
    {{ .Vehicle }}
  </td>
  <td data-label="Peso Líquido">
    {{ .NetWeight }}
  </td>
  <td id="operationDate" data-label="Data Operação">
    ...
  </td>
  <script type="module">
    import {formatDateToDisplay} from "/public/assets/js/date.js"
    const itemRow = document.querySelector("#operation-{{ .OperationType }}-{{ .Romaneio }}")
    if (itemRow) {
      itemRow.querySelector("#operationDate").textContent = formatDateToDisplay({{ .OperationDate}})
    }
  </script>
</tr>
{{ end }}
