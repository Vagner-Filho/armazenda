{{ block "report-list-item" . }}
<div class="flex justify-between" id="operation-{{ .OperationType }}-{{ .Romaneio }}">
  <div>
    {{ .Romaneio }}
  </div>
  <div>
    {{ if eq .OperationType 0 }}
        <div title="Entrada">
            <svg class="text-blue-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 16 16">
                <path fill="currentColor" d="M6 8H1V6h5V4l3 3l-3 3zm10-8v13l-6 3v-3H4V9h1v3h5V3l4-2H5v4H4V0z" />
            </svg>
        </div>
    {{ else }}
        <div title="Saída">
            <svg class="text-amber-500" title="Saída" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 16 16">
                <path fill="currentColor" d="M12 10V8H7V6h5V4l3 3zm-1-1v4H6v3l-6-3V0h11v5h-1V1H2l4 2v9h4V9z" />
            </svg>
        </div>
    {{ end }}
  </div>
  <div>
    {{ .Product }}
  </div>
  <div>
    {{ .Vehicle }}
  </div>
  <div>
    {{ .NetWeight }}
  </div>
  <div id="operationDate">
    ...
  </div>
  <script type="module">
    import {formatDateToDisplay} from "/public/assets/js/date.js"
    const itemRow = document.querySelector("#operation-{{ .OperationType }}-{{ .Romaneio }}")
    if (itemRow) {
      itemRow.querySelector("#operationDate").textContent = formatDateToDisplay({{ .OperationDate }})
    }
  </script>
</div>
{{ end }}
