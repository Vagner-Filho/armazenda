{{ block "report-list-item" . }}
<tr class="text-center whitespace-nowrap text-sm sm:text-base" id="operation-{{ .OperationType }}-{{ .Romaneio }}">
  <td data-label="Romaneio">
    {{ .Romaneio }}
  </td>
  <td data-label="Operação">
    {{ if eq .OperationType 0 }}
        <div title="Entrada">
            <svg class="text-blue-500 mx-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 16 16">
                <path fill="currentColor" d="M6 8H1V6h5V4l3 3l-3 3zm10-8v13l-6 3v-3H4V9h1v3h5V3l4-2H5v4H4V0z" />
            </svg>
        </div>
    {{ else }}
        <div title="Saída">
            <svg class="text-amber-500 mx-auto" title="Saída" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 16 16">
                <path fill="currentColor" d="M12 10V8H7V6h5V4l3 3zm-1-1v4H6v3l-6-3V0h11v5h-1V1H2l4 2v9h4V9z" />
            </svg>
        </div>
    {{ end }}
  </td>
  <td data-label="Pessoa">
    {{ .Person }}
  </td>
  <td data-label="Produto">
    {{ .Product }}
  </td>
  <td data-label="Veículo">
    {{ .Vehicle }}
  </td>
  <td data-label="Peso Líquido">
    {{ .NetWeight }}
  </td>
  <td id="operationDate" data-label="Data Operação">
    ...
  </td>
  <script type="module">
    import {formatDateToDisplay} from "/public/assets/js/date.js"
    const itemRow = document.querySelector("#operation-{{ .OperationType }}-{{ .Romaneio }}")
    if (itemRow) {
      itemRow.querySelector("#operationDate").textContent = formatDateToDisplay({{ .OperationDate }})
    }
  </script>
</tr>
{{ end }}
