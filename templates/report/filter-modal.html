{{ define "filter-modal" }}
<dialog id="filterDialog" data-filter-modal data-filter-path="/report/filter" class="glass-panel rounded-2xl w-full max-w-5xl backdrop:bg-black/60">
  <div class="relative p-6 lg:p-8">
    <button type="button" data-closes class="close-dialog-btn" aria-label="Fechar">&times;</button>

    <header class="flex items-center gap-3 mb-6 pr-8">
      <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-300 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </span>
      <div class="flex flex-col">
        <h1 class="text-xl lg:text-2xl font-bold text-white/95 leading-tight">Filtros do Relatório</h1>
        <p class="text-sm text-white/70">Combine os campos abaixo para refinar os resultados</p>
      </div>
    </header>

    {{ template "report-filter-form" . }}

    <footer class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 mt-6 pt-5 border-t border-white/15">
      <button type="button" id="clear-filter-dialog-btn"
        hx-trigger="click" hx-get="/report/filters"
        hx-target="form#report-filters-form" hx-swap="outerHTML"
        class="glass-btn text-sm flex items-center justify-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Limpar</span>
      </button>
      <button type="submit" form="report-filters-form"
        class="primary-glass-btn text-sm flex items-center justify-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Aplicar Filtros</span>
      </button>
    </footer>
  </div>
</dialog>
{{ end }}
