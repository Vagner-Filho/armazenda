{{ define "most-frequent-supplier-card.html" }}
<div class="glass-panel rounded-xl p-4" data-stat-type="{{ .Type }}">
  <div class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
      <path d="M0 0h24v24H0z" fill="none"/>
      <path fill="#FF9800" d="M3 13.5L2.25 12H7.5l-.6-1.5H2L1.25 9h7.8l-.6-1.5H1.11L.25 6H4a2 2 0 0 1 2-2h12v4h3l3 4v5h-2a3 3 0 0 1-3 3a3 3 0 0 1-3-3h-4a3 3 0 0 1-3 3a3 3 0 0 1-3-3H4v-3.5zm16 5a1.5 1.5 0 0 0 1.5-1.5a1.5 1.5 0 0 0-1.5-1.5a1.5 1.5 0 0 0-1.5 1.5a1.5 1.5 0 0 0 1.5 1.5m1.5-9H18V12h4.46zM9 18.5a1.5 1.5 0 0 0 1.5-1.5A1.5 1.5 0 0 0 9 15.5A1.5 1.5 0 0 0 7.5 17A1.5 1.5 0 0 0 9 18.5"/>
    </svg>
    <h3 class="text-sm font-medium text-white/80 inline">{{ .Title }}</h3>
  </div>
  {{ if .IsWeight }}
  <p class="text-2xl font-semibold text-white mt-1 weight-value">{{ .Value }}</p>
  {{ else }}
  <p class="text-2xl font-semibold text-white mt-1">{{ .Value }}</p>
  {{ end }}
  <p class="text-xs text-white/70 mt-1">{{ .PersonName }}</p>
</div>
{{ end }}
