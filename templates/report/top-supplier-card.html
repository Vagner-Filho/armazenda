{{ define "top-supplier-card.html" }}
<div class="glass-panel rounded-xl p-4" data-stat-type="{{ .Type }}">
  <div class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
	<path d="M0 0h24v24H0z" fill="none" />
	<path fill="#4CAF50" d="M3 4h14v4h3l3 4v5h-2a3 3 0 0 1-3 3a3 3 0 0 1-3-3H9a3 3 0 0 1-3 3a3 3 0 0 1-3-3H1V6a2 2 0 0 1 2-2m14 5.5V12h4.47L19.5 9.5zm-11 6A1.5 1.5 0 0 0 4.5 17A1.5 1.5 0 0 0 6 18.5A1.5 1.5 0 0 0 7.5 17A1.5 1.5 0 0 0 6 15.5m12 0a1.5 1.5 0 0 0-1.5 1.5a1.5 1.5 0 0 0 1.5 1.5a1.5 1.5 0 0 0 1.5-1.5a1.5 1.5 0 0 0-1.5-1.5M8 14l6-6l-1.41-1.42L8 11.17L5.91 9.08L4.5 10.5z" />
    </svg>
    <h3 class="text-sm font-medium text-white/80 inline">{{ .Title }}</h3>
  </div>
  {{ if .IsWeight }}
  <p class="text-2xl font-semibold text-white mt-1 weight-value">{{ .Value }}</p>
  {{ else }}
  <p class="text-2xl font-semibold text-white mt-1">{{ .Value }}</p>
  {{ end }}
  <p class="text-xs text-white/70 mt-1">{{ .PersonName }}</p>
</div>
{{ end }}
