{{ block "report-content" . }}
<tbody id="report-content" class="text-white/80">
  {{ range .Operations }}
  {{ template "report-list-item" . }}
  {{ end }}
  <tr class="text-sm sm:text-base font-semibold text-white bg-white/10">
    <td class="py-3 px-4 text-left" colspan="3" data-label="Balanço">
      Balanço:
    </td>
    <td class="py-3 px-4 text-left" data-label="Entradas">
      Entradas:
      <strong class="text-blue-400" id="entryTotal">{{ .EntryTotal }}</strong>
    </td>
    <td class="py-3 px-4 text-left" data-label="Saídas">
      Saídas:
      <strong class="text-amber-400" id="departureTotal">{{ .DepartureTotal }}</strong>
    </td>
    <td class="py-3 px-4 text-left" colspan="2" data-label="Saldo">
      Saldo:
      <strong class="{{ if lt .Balance 0.0 }} text-red-400{{ else }}text-green-400{{ end }}" id="balance">{{ .Balance
        }}</strong>
    </td>
  </tr>
  <script type="module">
    import { formatWeight } from '/public/assets/js/weight.js';

    const entryTotalEl = document.getElementById('entryTotal');
    if (entryTotalEl) {
      entryTotalEl.textContent = formatWeight(entryTotalEl.textContent);
    }

    const departureTotalEl = document.getElementById('departureTotal');
    if (departureTotalEl) {
      departureTotalEl.textContent = formatWeight(departureTotalEl.textContent);
    }

    const balanceEl = document.getElementById('balance');
    if (balanceEl) {
      balanceEl.textContent = formatWeight(balanceEl.textContent);
    }
  </script>
</tbody>
{{ end }}
