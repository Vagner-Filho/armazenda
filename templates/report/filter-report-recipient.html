{{ block "filter-report-recipient" . }}
<fieldset class="filter-card">
    <legend class="w-full text-center">
        <label for="recipient-filter" class="text-xs font-medium uppercase tracking-wider text-white/70">
            Destino
        </label>
    </legend>
    <select name="recipient" id="recipient-filter" class="w-full text-sm peer bg-white/10 text-white border-white/20">
        <option value="" selected>
            Nenhuma
        </option>
        {{ range .People }}
        <option {{ if eq .Id nil }} value="NULL" {{ else }} value="{{ .Id }}" {{ end }}>
            {{ .Name }}
        </option>
        {{ else }}
        <option value="-1">
            Nenhuma pessoa encontrada
        </option>
        {{ end }}
    </select>
</fieldset>
{{ end }}
