{{ block "config-form" . }}
<form hx-put="/farm/config" hx-swap="outerHTML" class="space-y-6">
    <input type="hidden" name="id" value="{{ .Id }}">
    {{ if .Farm.UF }}
        <input type="hidden" name="state" value="{{ .Farm.UF }}">
    {{ end }}
    <fieldset class="glass-panel rounded-xl p-6">
        <legend class="text-base lg:text-lg font-semibold text-white/95 border-b border-white/20 pb-2">
            Dados da Fazenda
        </legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col-reverse">
                <input type="text" name="name" id="name" value="{{ if .Farm.Name }}{{ .Farm.Name }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40" required>
                <label for="name" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Nome da Fazenda
                </label>
            </div>
            <div class="flex flex-col-reverse">
                <input type="text" name="storageName" id="storageName" value="{{ if .Farm.StorageName }}{{ .Farm.StorageName }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40" required>
                <label for="storageName" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Nome do Armazém
                </label>
            </div>
            <div class="flex flex-col-reverse">
                <input type="text" name="inscricaoEstadual" id="inscricaoEstadual" value="{{ .Farm.InscricaoEstadual }}"
                    class="no-default cursor-default bg-white/10 border-none text-white/60 placeholder-white/50 rounded-lg px-3 py-2 outline-0"
                    readonly>
                <label for="inscricaoEstadual" class="text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
	                <path d="M0 0h24v24H0z" fill="none" />
	                <path fill="currentColor" d="M6 22q-.825 0-1.412-.587T4 20V10q0-.825.588-1.412T6 8h1V6q0-2.075 1.463-3.537T12 1t3.538 1.463T17 6v2h1q.825 0 1.413.588T20 10v10q0 .825-.587 1.413T18 22zm7.413-5.587Q14 15.825 14 15t-.587-1.412T12 13t-1.412.588T10 15t.588 1.413T12 17t1.413-.587M9 8h6V6q0-1.25-.875-2.125T12 3t-2.125.875T9 6z" />
                    </svg>
                    Inscrição Estadual
                </label>
            </div>
            <div class="flex flex-col">
                <label for="farmUsedHumidityProgressionId" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Prog. Umidade para entradas da fazenda
                </label>
                <select name="farmUsedHumidityProgressionId" id="desconto-umidade-aplicado-fazenda" class="w-full bg-white/10 border-white/20 text-white peer">
                    {{ $farmProgression := .Farm.FarmUsedHumidityProgressionId }}
                    {{ range .Progressions }}
                        {{ if and (ne $farmProgression nil) (eq (deref $farmProgression) .Id) }}
                            <option value="{{ .Id }}" selected>{{ .Name }}</option>
                        {{ else }}
                            <option value="{{ .Id }}">{{ .Name }}</option>
                        {{ end }}
                    {{ end }}
                </select>
            </div>
        </div>
    </fieldset>
    <fieldset class="glass-panel rounded-xl p-6">
        <legend class="text-base lg:text-lg font-semibold text-white/95 border-b border-white/20 pb-2">
            Endereço
        </legend>
        <div class="grid grid-cols-1 md:grid-cols-6 gap-6">
            <div class="flex flex-col-reverse md:col-span-2">
                <input type="text" name="cep" id="cep" value="{{ if .Farm.Cep }}{{ .Farm.Cep }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="cep" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    CEP
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-4">
                <input type="text" name="street" id="street" value="{{ if .Farm.Street }}{{ .Farm.Street }}{{ end }}"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40 group-[.cep-data-loading]:animate-pulse">
                <label for="street" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Rua
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-2">
                <input type="text" name="number" id="number" value="{{ if .Farm.Number }}{{ .Farm.Number }}{{ end }}"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="number" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Número
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-4">
                <input type="text" name="complement" id="complement"
                    value="{{ if .Farm.Complement }}{{ .Farm.Complement }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="complement" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Complemento
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-3">
                <input type="text" name="neighborhood" id="neighborhood"
                    value="{{ if .Farm.Neighborhood }}{{ .Farm.Neighborhood }}{{ end }}"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40 group-[.cep-data-loading]:animate-pulse">
                <label for="neighborhood" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Bairro
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-2">
                <input type="text" name="city" id="city" value="{{ if .Farm.City }}{{ .Farm.City }}{{ end }}"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40 group-[.cep-data-loading]:animate-pulse">
                <label for="city" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Cidade
                </label>
            </div>
            <div class="flex flex-col-reverse md:col-span-1">
                <!--<input type="text" name="state" id="state" value="{{ if .Farm.State }}{{ .Farm.State }}{{ end }}"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40 group-[.cep-data-loading]:animate-pulse">-->
                <select id="state" disabled class="no-default cursor-default bg-white/10 border-none text-white/60 placeholder-white/50 rounded-lg px-3 py-2 outline-0" name="state" value="{{ if .Farm.UF }}{{ .Farm.UF }}{{ end }}">
                    <option value="" disabled {{ if eq .Farm.UF nil }}selected{{ end }}>Selecione</option>
                    <option value="AC" {{ if eq .Farm.UF "AC" }}selected{{ end }}>Acre</option>
                    <option value="AL" {{ if eq .Farm.UF "AL" }}selected{{ end }}>Alagoas</option>
                    <option value="AP" {{ if eq .Farm.UF "AP" }}selected{{ end }}>Amapá</option>
                    <option value="AM" {{ if eq .Farm.UF "AM" }}selected{{ end }}>Amazonas</option>
                    <option value="BA" {{ if eq .Farm.UF "BA" }}selected{{ end }}>Bahia</option>
                    <option value="CE" {{ if eq .Farm.UF "CE" }}selected{{ end }}>Ceará</option>
                    <option value="DF" {{ if eq .Farm.UF "DF" }}selected{{ end }}>Distrito Federal</option>
                    <option value="ES" {{ if eq .Farm.UF "ES" }}selected{{ end }}>Espírito Santo</option>
                    <option value="GO" {{ if eq .Farm.UF "GO" }}selected{{ end }}>Goiás</option>
                    <option value="MA" {{ if eq .Farm.UF "MA" }}selected{{ end }}>Maranhão</option>
                    <option value="MT" {{ if eq .Farm.UF "MT" }}selected{{ end }}>Mato Grosso</option>
                    <option value="MS" {{ if eq .Farm.UF "MS" }}selected{{ end }}>Mato Grosso do Sul</option>
                    <option value="MG" {{ if eq .Farm.UF "MG" }}selected{{ end }}>Minas Gerais</option>
                    <option value="PA" {{ if eq .Farm.UF "PA" }}selected{{ end }}>Pará</option>
                    <option value="PB" {{ if eq .Farm.UF "PB" }}selected{{ end }}>Paraíba</option>
                    <option value="PR" {{ if eq .Farm.UF "PR" }}selected{{ end }}>Paraná</option>
                    <option value="PE" {{ if eq .Farm.UF "PE" }}selected{{ end }}>Pernambuco</option>
                    <option value="PI" {{ if eq .Farm.UF "PI" }}selected{{ end }}>Piauí</option>
                    <option value="RJ" {{ if eq .Farm.UF "RJ" }}selected{{ end }}>Rio de Janeiro</option>
                    <option value="RN" {{ if eq .Farm.UF "RN" }}selected{{ end }}>Rio Grande do Norte</option>
                    <option value="RS" {{ if eq .Farm.UF "RS" }}selected{{ end }}>Rio Grande do Sul</option>
                    <option value="RO" {{ if eq .Farm.UF "RO" }}selected{{ end }}>Rondônia</option>
                    <option value="RR" {{ if eq .Farm.UF "RR" }}selected{{ end }}>Roraima</option>
                    <option value="SC" {{ if eq .Farm.UF "SC" }}selected{{ end }}>Santa Catarina</option>
                    <option value="SP" {{ if eq .Farm.UF "SP" }}selected{{ end }}>São Paulo</option>
                    <option value="SE" {{ if eq .Farm.UF "SE" }}selected{{ end }}>Sergipe</option>
                    <option value="TO" {{ if eq .Farm.UF "TO" }}selected{{ end }}>Tocantins</option>
                </select>
                <label for="state" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider flex items-center gap-1.5">
                    {{ template "lock-icon" }}
                    Estado
                </label>
            </div>
        </div>
    </fieldset>
    <fieldset class="glass-panel rounded-xl p-6">
        <legend class="text-base lg:text-lg font-semibold text-white/95 border-b border-white/20 pb-2">
            Contato
        </legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col-reverse">
                <input type="email" name="email" id="email" value="{{ if .Farm.Email }}{{ .Farm.Email }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="email" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Email
                </label>
            </div>
            <div class="flex flex-col-reverse">
                <input type="tel" name="phoneNumber" id="phoneNumber"
                    value="{{ if .Farm.PhoneNumber }}{{ .Farm.PhoneNumber }}{{ end }}" 
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="phoneNumber" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Telefone
                </label>
            </div>
        </div>
    </fieldset>
    <div class="mt-6 flex justify-center">
        <button type="submit" class="primary-glass-btn flex items-center gap-1 p-3">
            <iconify-icon icon="mdi:content-save" width="20" height="20"></iconify-icon>
            Salvar Alterações
        </button>
    </div>
</form>
{{ end }}
