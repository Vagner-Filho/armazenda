{{ block "field-selector" $ }}
<div class="flex flex-col w-full relative pr-[30px]">
  <label for="field-selector" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear text-xs lg:text-sm font-medium uppercase tracking-wider">
    Talhão
  </label>
  <select name="field" id="field-selector" class="w-full bg-white/10 border-white/20 text-white peer" required>
    {{ range $.Fields }}
            {{ if eq .Id $.SelectedField }}
                {{ template "selected-option" . }}
            {{ else }}
                {{ template "simple-option" . }}
            {{ end }}
    {{ else }}
    <option value="-1">
      Nenhum talhão encontrado
    </option>
    {{ end }}
  </select>
  <button class="icon-btn absolute right-0 bottom-2 text-[24px]" type="button" hx-get="/entry/field/form" hx-target="body" hx-swap="beforeend">
    <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
  </button>
</div>
{{ end }}
