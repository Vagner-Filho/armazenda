{{ block "field-form" . }}
<dialog id="fieldFormDialog" class="glass-panel rounded-xl w-72 sm:w-96">
  <div class="p-4 relative">
    {{ template "close-dialog-btn" (dict "selector" "dialog#fieldFormDialog" "CSPNonce" .CSPNonce) }}
    <header class="text-center mb-4">
      <h1 class="text-xl lg:text-2xl font-bold text-white/95 font-[Noto_Sans]">
        Novo Talhão
      </h1>
      <p class="text-sm text-white/90 mt-2">
        Preencha os campos abaixo para cadastrar um novo talhão.
      </p>
    </header>
    <form class="flex flex-col gap-4" hx-post="/field" hx-target="#field-selector" hx-swap="beforeend">
      <div class="flex flex-col-reverse">
        <input type="text" id="field-name" name="name" 
          class="peer bg-white/10 border-white/20 text-white placeholder-white/50" 
          required aria-placeholder="Nome" autofocus>
        <label for="field-name" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
          Nome do Talhão
        </label>
      </div>
      <div class="flex flex-col-reverse">
        <input type="number" step="0.0001" max="999999.99991" id="hectares" name="hectares" 
          class="peer bg-white/10 border-white/20 text-white placeholder-white/50" 
          required aria-placeholder="Hectares">
        <label for="hectares" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
          Hectares
        </label>
      </div>
      <div class="flex items-center justify-around mt-4 w-52 mx-auto">
        <button type="button" class="cancel-btn" onclick="closeFieldForm()">
          Cancelar
        </button>
        <button class="primary-glass-btn" type="submit">
          Adicionar
        </button>
      </div>
    </form>
  </div>
  <script nonce="{{ .CSPNonce }}" type="module">
    import { fieldDialogSetup } from "/public/assets/js/fieldDialog.js"
    fieldDialogSetup()
  </script>
</dialog>
{{ end }}
