{{ block "field-form" . }}
<dialog id="fieldFormDialog" class="rounded-md w-72 sm:w-96">
  <div class="p-2 relative">
    {{ template "close-dialog-btn" "dialog#fieldFormDialog" }}
    <h3 class="text-center px-2 font-semibold">
      NOVO TALHÃO
    </h3>
    <form class="flex flex-col" hx-post="/field" hx-target="#field-selector" hx-swap="beforeend">
      <div class="flex flex-col-reverse py-1">
        <input type="text" id="field-name" required class="peer px-2" name="name" aria-placeholder="Nome" autofocus>
        <label for="field-name" class="label-peer">Nome do Talhão</label>
      </div>
      <div class="flex flex-col-reverse py-1">
        <input type="number" step="0.0001" max="999999.99991" id="hectares" required class="peer px-2" name="hectares" aria-placeholder="Hectares">
        <label for="hectares" class="label-peer">Hectares</label>
      </div>
      <div class="flex items-center justify-center gap-2 mt-3">
        <button type="button" class="cancel-btn w-1/3" onclick="closeFieldForm()">
          CANCELAR
        </button>
        <button class="add-btn w-1/3">
          ADICIONAR
        </button>
      </div>
    </form>
  </div>
  <script type="module">
    import { fieldDialogSetup } from "/public/assets/js/fieldDialog.js"
    fieldDialogSetup()
  </script>
</dialog>
{{ end }}
