{{ define "product-totals" }}
<div class="col-span-1 sm:col-span-2 lg:col-span-3 mt-4" id="product-totals-container">
  <h3 class="text-lg font-semibold text-white mb-4 px-2">Visão por Produto</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {{ range . }}
    <div class="glass-panel rounded-xl p-4" data-stat-type="product_total" data-product="{{ .ProductName }}">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none"/>
          <path fill="#26A69A" d="M7.33 18.33c-.83-1.16-.83-2.5-.83-3.83c1.67 1 3.33 2 4.17 3.17l.33.56v-2.28c-1.5-.9-2.92-1.82-3.67-2.87c-.83-1.16-.83-2.5-.83-3.83c1.67 1 3.33 2 4.17 3.17L11 13v-2.3c-1.5-.9-2.92-1.82-3.67-2.87C6.5 6.67 6.5 5.33 6.5 4c1.67 1 3.33 2 4.17 3.17q.15.21.27.45c-.17-.62-.28-1.2-.29-1.8c-.01-1.51.65-3.06 1.31-4.61c.69 1.48 1.38 2.97 1.39 4.48c.01.63-.1 1.27-.28 1.9c.08-.14.16-.28.26-.42C14.17 6 15.83 5 17.5 4c0 1.33 0 2.67-.83 3.83C15.92 8.88 14.5 9.8 13 10.7V13l.33-.58c.84-1.17 2.5-2.17 4.17-3.17c0 1.33 0 2.67-.83 3.83c-.75 1.05-2.17 1.97-3.67 2.87v2.28l.33-.56c.84-1.17 2.5-2.17 4.17-3.17c0 1.33 0 2.67-.83 3.83c-.75 1.05-2.17 1.97-3.67 2.87V23h-2v-1.8c-1.5-.9-2.92-1.82-3.67-2.87"/>
        </svg>
        <h3 class="text-sm font-medium text-white/80">{{ .ProductName }}</h3>
      </div>
      <p class="text-2xl font-semibold text-white mt-1 weight-value">{{ printf "%.2f" .EntryTotal }}</p>
      <p class="text-xs text-white/70 mt-1">Enviado: <span class="weight-value">{{ printf "%.2f" .DepartureTotal }}</span></p>
    </div>
    {{ else }}
    <div class="glass-panel rounded-xl p-4 col-span-full">
      <p class="text-white/70">Nenhum registro</p>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
