{{ define "most-productive-field" }}
<div class="col-span-12 grid grid-cols-1 sm:grid-cols-2 gap-4 bg-white p-4 rounded-lg shadow-md">
  <div class="h-60 sm:h-96 w-full">
    <canvas id="fieldVolumeProdChart"></canvas>
  </div>
  <div class="h-60 sm:h-96 w-full">
    <canvas id="fieldSizeRelativeProdChart"></canvas>
  </div>
</div>
<script type="module">
  import {setupFieldProdChart} from "/public/assets/js/chart.js"
  setupFieldProdChart('fieldVolumeProdChart', 'Talhão Maior Volume', [{{ range .Nominal }}'{{ .Name }}',{{ end }}], [{{ range .Nominal }}{{ .Productivity }},{{ end }}]);
  setupFieldProdChart('fieldSizeRelativeProdChart', 'Talhão Mais Produtivo (Peso Líquido / hectare)', [{{ range .Relative }}'{{ .Name }}',{{ end }}], [{{ range .Relative }}{{ .Productivity }},{{ end }}]);
</script>
{{ end }}
