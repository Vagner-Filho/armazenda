{{ define "most-productive-field" }}
<div class="col-span-1 sm:col-span-2 lg:col-span-3 mt-4" id="productive-field-container"
     data-nominal-names="{{ .NominalNamesJSON }}"
     data-nominal-values="{{ .NominalValuesJSON }}"
     data-relative-names="{{ .RelativeNamesJSON }}"
     data-relative-values="{{ .RelativeValuesJSON }}">
  <div>
    <h3 class="text-lg font-semibold text-white mb-4 px-2">Produtividade por Talhão</h3>
    <div class="grid grid-cols-1 gap-4">
      <div class="h-60 sm:h-80 w-full glass-panel p-4 rounded-xl">
        <canvas id="fieldVolumeProdChart"></canvas>
      </div>
      <div class="h-60 sm:h-80 w-full glass-panel p-4 rounded-xl">
        <canvas id="fieldSizeRelativeProdChart"></canvas>
      </div>
    </div>
  </div>
</div>
{{ end }}
