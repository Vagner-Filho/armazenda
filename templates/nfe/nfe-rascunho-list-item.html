{{ block "nfe-rascunho-list-item" . }}
<tr class="text-sm sm:text-base border-b border-sky-50/30 hover:bg-sky-50/10 whitespace-nowrap" id="nfe-rascunho-{{ .ID }}" data-test-id="rascunho-row">
  <td class="py-3 px-4 text-left" data-label="Nome">
    <span data-test-id="rascunho-nome">{{ .Name }}</span>
  </td>
  <td class="py-3 px-4 text-left" data-label="Destinatário">
    {{ if .RecipientName }}{{ .RecipientName }}{{ else }}Sem destinatário{{ end }}
  </td>
  <td class="py-3 px-4 text-left" data-label="Itens">
    {{ len .Items }}
  </td>
  <td class="py-3 px-4 text-left" data-label="Ações">
    <div class="flex items-center justify-end lg:justify-start gap-2">
      <a href="/nfe/emitir/rascunho/{{ .ID }}" title="Gerar NF-e a partir do rascunho" class="icon-btn"
        data-test-id="gerar-nfe-rascunho">
        <iconify-icon icon="mdi:file-document-plus-outline" class="text-xl"></iconify-icon>
      </a>
      <button type="button" hx-get="/nfe/rascunho/form/{{ .ID }}" hx-target="body" hx-swap="beforeend" title="Editar Rascunho"
        class="icon-btn" data-test-id="editar-rascunho">
        <iconify-icon icon="mdi:pencil" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-trigger="confirmed" hx-delete="/nfe/rascunho/{{ .ID }}" hx-target="#nfe-rascunho-{{ .ID }}"
        hx-swap="delete" title="Excluir Rascunho" class="icon-btn" data-delete-text="Deseja excluir o rascunho {{ .Name }} ?"
        data-test-id="excluir-rascunho">
        <iconify-icon icon="mdi:trash-can" class="text-xl"></iconify-icon>
      </button>
    </div>
  </td>
</tr>
{{ end }}
