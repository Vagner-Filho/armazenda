{{ block "nfe-preview" . }}
<div id="nfe-emit-step">
    <div class="mb-3 p-3 rounded-lg bg-yellow-500/15 border border-yellow-500/40 text-yellow-200 text-xs text-center font-bold uppercase tracking-wide">
        Documento de Pré-visualização — Sem Valor Fiscal
    </div>
    <div class="mb-4 mx-auto rounded-lg overflow-hidden border border-white/10 bg-white/5" style="aspect-ratio: 1/1.414; max-height: 65vh;">
        <iframe src="data:application/pdf;base64,{{ .PDFBase64 }}" class="w-full h-full border-0"
            title="Pré-visualização DANFE"></iframe>
    </div>
    <div class="mb-4 grid grid-cols-2 gap-2 text-white/80 text-base *:text-center">
        <p><strong>Romaneio:</strong> {{ .DepartureID }}</p>
        <p><strong>Produto:</strong> {{ .Product }}</p>
        <p><strong>Peso Líquido:</strong> <span data-raw-weight="{{ .NetWeight }}">{{ .NetWeight }}</span></p>
        <p><strong>Preço Unitário:</strong> <span data-raw-value="{{ .UnitPrice }}">{{ .UnitPrice }}</span></p>
        <p class="col-span-2"><strong>Valor Total:</strong> <span data-raw-value="{{ .TotalValue }}">{{ .TotalValue }}</span></p>
    </div>
    <form class="flex flex-col gap-4" hx-post="/nfe/build/{{ .DepartureID }}" hx-target="this" hx-swap="none"
        hx-indicator="#nfe-emit-spinner">
        <input type="hidden" name="unitPrice" value="{{ .UnitPrice }}">
        <input type="hidden" name="cfop" value="{{ .CFOP }}">
        <input type="hidden" name="icmsRate" value="{{ .ICMSRate }}">
        <input type="hidden" name="pisRate" value="{{ .PISRate }}">
        <input type="hidden" name="cofinsRate" value="{{ .COFINSRate }}">
        <input type="hidden" name="naturezaOp" value="{{ .NaturezaOp }}">
        <input type="hidden" name="productDesc" value="{{ .ProductDesc }}">
        <input type="hidden" name="ncm" value="{{ .NCM }}">
        <input type="hidden" name="cest" value="{{ .CEST }}">
        <input type="hidden" name="unit" value="{{ .Unit }}">
        <input type="hidden" name="modFrete" value="{{ .ModFrete }}">
        <input type="hidden" name="icmsCST" value="{{ .ICMSCST }}">
        <input type="hidden" name="pisCST" value="{{ .PISCST }}">
        <input type="hidden" name="cofinsCST" value="{{ .COFINSCST }}">
        <input type="hidden" name="infCpl" value="{{ .InfCpl }}">
        <div class="flex items-center justify-center gap-2">
            <button type="button" hx-get="/nfe/modal/{{ .DepartureID }}" hx-target="#nfe-emit-dialog"
                hx-swap="outerHTML" class="glass-btn flex items-center gap-1 p-3">
                <iconify-icon icon="mdi:arrow-left" width="20" height="20"></iconify-icon>
                Voltar
            </button>
            <button type="submit" class="primary-glass-btn flex items-center gap-1 p-3" id="confirm-nfe" data-test-id="confirm-nfe">
                <iconify-icon icon="mdi:receipt-text" width="20" height="20"></iconify-icon>
                Confirmar e Emitir
            </button>
            <button type="button" id="nfe-result" class="primary-glass-btn hidden p-3">
                <a id="nfe-download-link" href="#" download="nfe.xml" class="flex items-center gap-1">
                    <iconify-icon icon="mdi:download" width="20" height="20"></iconify-icon>
                    Baixar XML Assinado
                </a>
            </button>
            <span id="nfe-emit-spinner" class="htmx-indicator animate-spin text-white">
                <iconify-icon icon="mdi:loading" width="24" height="24"></iconify-icon>
            </span>
        </div>
    </form>
</div>
<script nonce="{{ .CSPNonce }}" type="module">
    (function() {
        const dialog = document.querySelector('#nfe-emit-dialog');
        if (dialog) {
            dialog.classList.remove('max-w-lg');
            dialog.classList.add('max-w-4xl');
        }
    })();
</script>
<script nonce="{{ .CSPNonce }}" type="module">
    import { formatWeight } from "/public/assets/js/weight.js";

    const weightEl = document.querySelector('[data-raw-weight]');
    if (weightEl) {
        weightEl.textContent = formatWeight(weightEl.dataset.rawWeight);
    }

    const currencyFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    document.querySelectorAll('[data-raw-value]').forEach(el => {
        const val = parseFloat(el.dataset.rawValue);
        if (!isNaN(val)) {
            el.textContent = currencyFmt.format(val);
        }
    });
</script>
{{ end }}
