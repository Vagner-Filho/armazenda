{{ block "cfop-selector" . }}
<div class="cfop-selector flex flex-col w-full {{ .Class }}" data-cfop-selector data-test-id="cfop-selector">
  <label class="w-full px-2 text-white/70 text-xs lg:text-sm font-medium uppercase tracking-wider" data-cfop-label>
    CFOP
  </label>
  <div class="cfop-selector-controls">
    <div class="cfop-combobox">
      <button type="button" class="cfop-trigger" role="combobox" aria-haspopup="listbox"
              aria-expanded="false" aria-required="true" data-cfop-trigger data-test-id="cfop-trigger">
        <span class="cfop-trigger-label" data-cfop-selected-label>{{ .Selected }}</span>
        <svg class="cfop-trigger-chevron" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="m7 10 5 5 5-5z"/></svg>
      </button>
      <select name="{{ .Name }}" class="cfop-select cfop-native-select"
              aria-hidden="true" tabindex="-1" required data-cfop-select data-test-id="cfop-select">
        {{ template "cfop-options" (dict "Options" .Options "Selected" .Selected) }}
      </select>
      <div class="cfop-menu" popover="manual" data-cfop-menu data-cfop-open="false">
        <div class="cfop-search-header">
          <input type="search" class="cfop-search" placeholder="Buscar código, descrição ou origem/destino…"
                 autocomplete="off" aria-label="Buscar CFOP por código, descrição ou origem/destino"
                 data-test-id="cfop-search">
        </div>
        <div class="cfop-options-scroll" role="listbox" aria-label="Opções de CFOP" data-cfop-options-list></div>
        <p class="cfop-empty" role="status" data-cfop-empty hidden>Nenhum CFOP encontrado.</p>
      </div>
    </div>
    <button class="icon-btn text-[24px] flex items-center" type="button" data-cfop-add
            hx-get="/nfe/cfop/form" hx-target="body" hx-swap="beforeend" data-test-id="cfop-add"
            title="Cadastrar CFOP" aria-label="Cadastrar CFOP">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z"/></svg>
    </button>
  </div>
</div>
{{ end }}
