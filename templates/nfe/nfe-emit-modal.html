{{ block "nfe-emit-modal" . }}
<dialog id="nfe-emit-dialog" class="glass-panel rounded-xl w-full max-w-lg">
    <div class="p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-white">Emitir NF-e</h2>
            {{ template "close-dialog-btn" (dict "selector" "dialog#nfe-emit-dialog" "CSPNonce" .CSPNonce) }}
        </div>
        <div class="mb-4 text-white/80 text-sm">
            <p><strong>Romaneio:</strong> {{ .DepartureID }}</p>
            <p><strong>Produto:</strong> {{ .Product }}</p>
            <p><strong>Peso Líquido:</strong> <span class="format-weight">{{ .NetWeight }}</span></p>
        </div>
        <form class="flex flex-col gap-4" hx-post="/nfe/build/{{ .DepartureID }}" hx-target="this" hx-swap="none"
            hx-indicator="#nfe-emit-spinner" hx-on::after-request="handleNFeResponse(event)">
            <div class="flex flex-col-reverse">
                <input type="text" inputmode="decimal" name="unitPrice" id="unitPrice" required
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40"
                    placeholder="0,00">
                <label for="unitPrice" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    Preço Unitário (R$/KG)
                </label>
            </div>
            <div class="flex flex-col-reverse">
                <input type="text" name="cfop" id="cfop" value="5101"
                    class="peer bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-lg px-3 py-2 focus:outline-none focus:border-white/40">
                <label for="cfop" class="peer-focus:text-white text-white/70 transition-all duration-300 ease-linear px-2 text-xs lg:text-sm font-medium uppercase tracking-wider">
                    CFOP (opcional)
                </label>
            </div>
            <div class="flex items-center justify-center gap-2">
                <button type="submit" class="primary-glass-btn flex items-center gap-1 p-3">
                    <iconify-icon icon="mdi:receipt-text" width="20" height="20"></iconify-icon>
                    Emitir NF-e
                </button>
                <span id="nfe-emit-spinner" class="htmx-indicator animate-spin text-white">
                    <iconify-icon icon="mdi:loading" width="24" height="24"></iconify-icon>
                </span>
            </div>
        </form>
        <div id="nfe-result" class="hidden mt-4">
            <a id="nfe-download-link" href="#" download="nfe.xml" class="primary-glass-btn flex items-center gap-1 p-2 text-sm w-full justify-center">
                <iconify-icon icon="mdi:download" width="18" height="18"></iconify-icon>
                Baixar XML Assinado
            </a>
        </div>
    </div>
    <script nonce="{{ .CSPNonce }}">
        function handleNFeResponse(evt) {
            const dialog = document.querySelector('#nfe-emit-dialog');
            if (evt.detail.successful) {
                const xml = evt.detail.xhr.responseText;
                const blob = new Blob([xml], { type: 'application/xml' });
                const url = URL.createObjectURL(blob);
                const link = document.querySelector('#nfe-download-link');
                link.href = url;
                link.download = 'nfe_' + {{ .DepartureID }} + '.xml';
                document.querySelector('#nfe-result').classList.remove('hidden');
            }
        }

        // Close dialog handler
        const dialogEl = document.querySelector('#nfe-emit-dialog');
        if (dialogEl) {
            dialogEl.addEventListener('close', function() {
                dialogEl.remove();
            });
            dialogEl.showModal();
        }
    </script>
</dialog>
{{ end }}
