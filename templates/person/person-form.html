    <form id="pessoa-form" hx-post="/person/legal" hx-target="#people-rows" hx-swap="beforeend" class="gap-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <fieldset class="flex flex-col gap-2 p-2 bg-white rounded-lg shadow" id="pessoa-juridica-fieldset">
          <legend class="fieldset-legend">
            Identificação
          </legend>
          <div class="flex flex-col-reverse">
            <input type="text" name="companyName" id="person-name-pj" class="peer" required>
            <label for="person-name-pj" class="label-peer">
              Razão Social
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="text" name="fantasyName" id="fantasy-name" class="peer">
            <label for="fantasy-name" class="label-peer">
              Nome Fantasia (opcional)
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="text" name="cnpj" id="document-pj" class="peer" required maxlength="14">
            <label for="document-pj" class="label-peer">
              CNPJ
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="text" name="inscricaoEstadual" id="ie-pj" class="peer" required>
            <label for="ie-pj" class="label-peer">
              Inscrição Estadual
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="number" step="0.1" name="humidityDiscount" id="desconto-umidade-pj" class="peer" required value="1.7">
            <label for="desconto-umidade-pj" class="label-peer">
              Desconto Umidade
            </label>
          </div>
        </fieldset>
        <fieldset class="flex-col gap-2 p-2 bg-white rounded-lg shadow hidden" id="pessoa-fisica-fieldset">
          <legend class="fieldset-legend">
            Identificação
          </legend>
          <div class="flex flex-col-reverse">
            <input type="text" name="name" id="person-name-pf" class="peer" required disabled>
            <label for="person-name-pf" class="label-peer">
              Nome
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="text" name="cpf" id="document-pf" class="peer" required maxlength="11" disabled>
            <label for="document-pf" class="label-peer">
              CPF
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="text" name="inscricaoEstadual" id="ie-pf" class="peer" required disabled>
            <label for="ie-pf" class="label-peer">
              Inscrição Estadual
            </label>
          </div>
          <div class="flex flex-col-reverse">
            <input type="number" step="0.1" name="humidityDiscount" id="desconto-umidade-pf" class="peer" required value="1.7" disabled>
            <label for="desconto-umidade-pf" class="label-peer">
              Desconto Umidade
            </label>
          </div>
        </fieldset>
        {{ template "address-fields" .Address }}
      </div>
      <div class="flex items-center justify-around mt-2 w-52 mx-auto">
        <button type="button" class="cancel-btn" onclick="closePersonForm()">
          Cancelar
        </button>
        <button class="add-btn" type="submit">
          Adicionar
        </button>
      </div>
    </form>
  </div>
  <script type="module">
    import {removeEmptyFields} from "/public/assets/js/form.js"
    const dialogEl = document.querySelector("dialog#personFormDialog")
    if (dialogEl) {
      dialogEl.showModal()

      function closePersonForm() {
        dialogEl.close()
        dialogEl.remove()
        window.closePersonForm = undefined
      }
      dialogEl.addEventListener('close', closePersonForm)
      window.closePersonForm = closePersonForm

      document.body.addEventListener('htmx:configRequest', function (evt) {
        evt.detail.parameters = removeEmptyFields(evt.detail.parameters);
      });
    }

    let pessoaJuridicaBtn = document.querySelector('button#pessoa-juridica-btn')
    let pessoaFisicaBtn = document.querySelector('button#pessoa-fisica-btn')
    let pessoaForm = document.querySelector('form#pessoa-form')
    let naturalFieldset = document.querySelector('fieldset#pessoa-fisica-fieldset')
    let legalFieldset = document.querySelector('fieldset#pessoa-juridica-fieldset')

    function toggleForm() {
        if (naturalFieldset && naturalFieldset.classList.contains('hidden')) {
          legalFieldset.classList.add('hidden')
          legalFieldset.classList.remove('flex')

          legalFieldset.querySelectorAll('input')
            .forEach((i) => {
              i.setAttribute('disabled', true)
            })

          naturalFieldset.querySelectorAll('input')
            .forEach((i) => {
              i.removeAttribute('disabled')
            })

          naturalFieldset.classList.add('flex')
          naturalFieldset.classList.remove('hidden')

          pessoaJuridicaBtn.classList.remove('text-white', 'bg-sky-500')
          pessoaJuridicaBtn.classList.add('text-sky-500')
          pessoaFisicaBtn.classList.remove('text-sky-500')
          pessoaFisicaBtn.classList.add('text-white', 'bg-sky-500')

          pessoaForm.setAttribute('hx-post', '/person/natural')
          return
        }
        naturalFieldset.classList.add('hidden')
        naturalFieldset.classList.remove('flex')

        naturalFieldset.querySelectorAll('input')
          .forEach((i) => {
            i.setAttribute('disabled', true)
          })

        legalFieldset.querySelectorAll('input')
          .forEach((i) => {
            i.removeAttribute('disabled')
          })

        legalFieldset.classList.add('flex')
        legalFieldset.classList.remove('hidden')

        pessoaFisicaBtn.classList.remove('text-white', 'bg-sky-500')
        pessoaFisicaBtn.classList.add('text-sky-500')
        pessoaJuridicaBtn.classList.remove('text-sky-500')
        pessoaJuridicaBtn.classList.add('text-white', 'bg-sky-500')

        pessoaForm.setAttribute('hx-post', '/person/legal')
      }

    window.toggleForm = toggleForm
  </script>
</dialog>
{{ end }}
