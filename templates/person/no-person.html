{{ define "no-person" }}
<div class="w-fit mx-auto text-center my-[10vh]" id="no-person-helper">
  <span class="block text-8xl h-[130px] w-[130px] mx-auto relative">
    &#128230;
    <span class="absolute -top-1 -right-4 text-6xl text-red-500 drop-shadow-lg">
      &#128711;
    </span>
  </span>
  <strong class="text-orange-500 text-xl md:text-2xl">
    Nenhuma pessoa encontrada :(
  </strong>
  <button id="form" type="button" class="add-btn flex items-center gap-1 mx-auto text-xl mt-2 cursor-pointer"
    hx-get="/person/form" hx-target="body" hx-swap="beforeend">
    <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
    Começar agora
  </button>
  <script type="module">
    function handleAddFirstDeparture(evt) {
      if (evt.detail.requestConfig.path === '/person' && evt.detail.requestConfig.verb === 'post' && evt.detail.xhr.status === 201) {
        const departureContent = document.querySelector('#departure-content');
        if (departureContent) {
          departureContent.classList.remove('hidden')

          const helper = document.querySelector('#no-departure-helper');
          if (helper) {
            document.body.removeEventListener('htmx:afterRequest', handleAddFirstDeparture);
            helper.remove()
          }
        }
      }
    }
    document.body.addEventListener('htmx:afterRequest', handleAddFirstDeparture);
  </script>
</div>
{{ end }}
