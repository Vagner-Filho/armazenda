{{ block "origin-selector" $ }}
<div class="flex flex-col w-full relative gap-2">
  <label for="origin-selector" class="peer-focus:text-white px-2 text-white/70 transition-all duration-300 ease-linear text-xs lg:text-sm font-medium uppercase tracking-wider">
    Origem
  </label>
  <select name="origin" id="origin-selector" class="w-full bg-white/10 border-white/20 text-white peer">
    {{ range $.People }}
    <option
      {{ if eq .Id nil }} value="" {{ else }} value="{{ .Id }}" {{ end }} data-humidity-progression-id="{{ .PersonConfig.HumidityProgressionId }}" data-entry-soy-discount="{{ .PersonConfig.EntrySoyDiscount }}" data-entry-corn-discount="{{ .PersonConfig.EntryCornDiscount }}"
      {{ if eq .Id $.SelectedOrigin }} selected {{ end }}>
      {{ .Name }}
    </option>
    {{ else }}
    <option value="-1">
      Nenhuma pessoa encontrada
    </option>
    {{ end }}
  </select>
</div>
{{ end }}
