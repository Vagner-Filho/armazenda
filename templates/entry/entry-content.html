{{ block "entry-content" . }}
{{ template "entry-filters" .Filters }}
<div class="{{ if .NoContent }} hidden {{ end }}" id="entry-content">
  <div class="flex flex-wrap justify-between items-center mb-4">
    <div class="flex items-center gap-4 w-full justify-end">
      <button id="form" type="button" class="add-btn flex items-center gap-1" hx-get="/entry/form" hx-target="body" hx-swap="beforeend">
        <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
        Nova Entrada
      </button>
    </div>
  </div>
  <main id="list" class="bg-white rounded-lg shadow overflow-hidden">
    {{ template "entry-table" .Entries }}
  </main>
</div>
<div class="mt-8">
  <h2 class="text-2xl font-bold text-slate-700 mb-4 text-center">Rascunhos</h2>
  <button id="form" type="button" class="ml-auto btn-shape text-slate-500 hover:text-white hover:bg-slate-500 focus:text-white focus:bg-slate-500 ring ring-inset ring-slate-500 transition-colors duration-300 ease-in-out flex items-center gap-1" hx-get="/entry/draft/form" hx-target="body" hx-swap="beforeend">
    <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
    Novo Rascunho
  </button>
  <main id="draft-list" class="bg-white rounded-lg shadow overflow-hidden">
    {{ template "entry-draft-table" .Drafts }}
  </main>
</div>
{{ if .NoContent }}
<div class="bg-white shadow-md rounded-lg p-4">
  {{ template "no-entry" }}
</div>
{{ end }}
{{ end }}
