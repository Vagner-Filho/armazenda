{{ block "entry-content" . }}
{{ if .NoContent }}
{{ template "no-entry" . }}
{{ end }}
<div class="{{ if .NoContent }} hidden {{ end }} glass-panel rounded-xl shadow-center p-4" id="entry-content">
  <div class="flex items-center gap-3 mb-4 flex-wrap">
    <button data-opens="entryFilterDialog" type="button" class="glass-btn text-sm flex items-center gap-1.5 shrink-0" aria-haspopup="dialog" aria-controls="entryFilterDialog">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      <span>Filtros</span>
    </button>
    {{ template "entry-filter-chips" .AppliedChips }}
    <button id="form" type="button" class="primary-glass-btn flex items-center gap-1 whitespace-nowrap shrink-0 ml-auto" hx-get="/entry/form"
      hx-target="body" hx-swap="beforeend">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z" />
      </svg>
      Nova Entrada
    </button>
  </div>
  <main id="list" class="overflow-hidden">
    {{ template "entry-table" . }}
  </main>
</div>
{{ template "entry-filter-modal" .Filters }}
<div class="mt-2 glass-panel rounded-xl overflow-hidden p-4">
  <h2 class="text-xl lg:text-2xl font-bold text-white/95 text-center mt-8">Rascunhos</h2>
  <p class="text-center text-sm text-white/60 mt-2">
    Acelere o lançamento de entradas a partir de um rascunho
  </p>
  <div class="flex justify-end items-center mb-4">
    <button id="form" type="button"
      class="btn-shape text-white/60 hover:text-white hover:bg-slate-500 focus:text-white focus:bg-slate-500 ring ring-inset ring-slate-500 transition-colors duration-300 ease-in-out flex items-center gap-1"
      hx-get="/entry/draft/form" hx-target="body" hx-swap="beforeend">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z" />
      </svg>
      Novo Rascunho
    </button>
  </div>
  <main id="draft-list" hx-get="/entry/draft/list" hx-trigger="load" hx-swap="innerHTML">
    <div class="flex justify-center items-center p-4">
      <img src="/public/assets/static/spinner.svg" class="animate-spin h-8 w-8 text-white/60" alt="Carregando...">
    </div>
  </main>
</div>
{{ end }}
