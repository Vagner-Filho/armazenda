{{ define "filter-entry-netweight" }}
<fieldset class="flex gap-1 filter-card">
    <legend class="w-full text-center text-xs font-medium uppercase tracking-wider text-white/70">
        Peso líquido
    </legend>
    <div class="flex flex-col-reverse w-full sm:max-w-20 lg:max-w-24">
        <input type="number" name="netWeightMin" id="net-min-filter" aria-placeholder="Peso líquido mínimo em kg" placeholder="em kg" class="w-full text-sm peer bg-white/10 text-white border-white/20 placeholder:text-white/40" />
        <label for="net-min-filter" class="px-2 text-xs text-white/80 peer-focus:text-green-400">Mínimo</label>
    </div>
    <div class="flex flex-col-reverse w-full sm:max-w-20 lg:max-w-24">
        <input type="number" name="netWeightMax" id="net-max-filter" aria-placeholder="Peso líquido máximo" class="w-full text-sm peer bg-white/10 text-white border-white/20 placeholder:text-white/40" placeholder="em kg" />
        <label for="net-max-filter" class="px-2 text-xs text-white/80 peer-focus:text-green-400">Máximo</label>
    </div>
</fieldset>
{{ end }}
