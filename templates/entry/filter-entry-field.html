{{ block "filter-entry-field" . }}
<fieldset class="filter-card">
    <legend class="w-full text-center">
        <label for="field-filter" class="text-xs font-medium uppercase tracking-wider text-white/70">
            Talhão
        </label>
    </legend>
    <select name="field" id="field-filter" class="w-full text-sm peer bg-white/10 text-white border-white/20">
        <option value="">
            Nenhum
        </option>
        {{ range . }}
        {{ template "field-option" . }}
        {{ else }}
        <option value="-1">
            Nenhum talhão encontrado
        </option>
        {{ end }}
    </select>
</fieldset>
{{ end }}
