{{ block "filter-entry-field" . }}
<fieldset class="filter-card">
    <legend class="w-full text-center">
        <label for="field-filter" class="font-medium text-sm text-white/90">
            Talhão
        </label>
    </legend>
    <select name="field" id="field-filter" class="w-full text-sm peer bg-slate-800/80 text-white/90 border-white/20">
        <option value="">
            Nenhum
        </option>
        {{ range . }}
        {{ template "field-option" . }}
        {{ else }}
        <option value="-1">
            Nenhum talhão encontrado
        </option>
        {{ end }}
    </select>
</fieldset>
{{ end }}
