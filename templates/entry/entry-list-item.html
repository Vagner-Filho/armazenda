{{ block "entry-list-item" . }}
<tr class="text-center whitespace-nowrap text-sm sm:text-base" id="entry-{{ .Id }}">
  <td>
    {{ .Id }}
  </td>
  <td>
    {{ .Product }}
  </td>
  <td>
    {{ .Field }}
  </td>
  <td>
    {{ .Vehicle }}
  </td>
  <td>
    {{ .NetWeight }}
  </td>
  <td id="arrivalDate">
    {{ .ArrivalDate }}
  </td>
  <td>
    <div class="flex items-center justify-center gap-2 text-green-500">
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <button type="button" id="{{ .Id }}" onclick="getEntryPdf(this)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1">
            <path stroke-width="1.5" d="M7.792 21.25h8.416a3.5 3.5 0 0 0 3.5-3.5v-5.53a3.5 3.5 0 0 0-1.024-2.475l-5.969-5.97A3.5 3.5 0 0 0 10.24 2.75H7.792a3.5 3.5 0 0 0-3.5 3.5v11.5a3.5 3.5 0 0 0 3.5 3.5"/>
            <path stroke-width="1.5" d="M11.688 3.11v5.66a2 2 0 0 0 2 2h5.662"/>
            <path d="M7.25 16.5v-1m0 0v-2h1a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1zm4 1v-3h.5a1.5 1.5 0 0 1 0 3zm4 0v-1.25m1.5-1.75h-1.5v1.75m0 0h1.5"/>
          </g>
        </svg>
      </button>
      <button type="button" hx-get="/entry/form/{{ .Id }}" hx-target="body" hx-swap="beforeend">
        <iconify-icon icon="la:pen"></iconify-icon>
      </button>
      <button type="button" hx-trigger="confirmed" hx-delete="/entry/{{ .Id }}" hx-target="#entry-{{ .Id }}" hx-swap="delete" onClick="Swal.fire({title: 'Excluir', text:'Deseja excluir o romaneio de entrada {{ .Id }} ?', showCancelButton: true, cancelButtonText: 'Cancelar', cancelButtonColor: '#ff7200', reverseButtons: true, confirmButtonText: 'Excluir', confirmButtonColor: '#22c55e'}).then((result)=>{
                    if (result.isConfirmed) {
                        htmx.trigger(this, 'confirmed');
                    }
                })">
        <iconify-icon icon="la:trash-alt-solid"></iconify-icon>
      </button>
    </div>
  </td>
  <script type="module">
    import {formatDateToDisplay} from "/public/assets/js/date.js"
    const itemRow = document.querySelector("tr#entry-{{ .Id }}")
    if (itemRow) {
      itemRow.querySelector("td#arrivalDate").textContent = formatDateToDisplay({{ .ArrivalDate}})
        }
  </script>
</tr>
{{ end }}
