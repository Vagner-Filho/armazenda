{{ block "entry-list-item" . }}
<tr class="text-sm border-b border-sky-50/30 hover:bg-sky-50/10 whitespace-nowrap" id="entry-{{ .Id }}">
  <td class="py-3 px-4 text-left" data-label="Romaneio">
    {{ .Id }}
  </td>
  <td class="py-3 px-4 text-left {{ if eq .Product "Milho" }}text-yellow-300{{ else }}text-emerald-300{{ end }}"
    data-label="Produto">
    {{ .Product }}
  </td>
  <td class="py-3 px-4 text-left truncate max-w-64" data-label="Origem" title="{{ .Origin }}">
    {{ .Origin }}
  </td>
  <td class="py-3 px-4 text-left" data-label="Talhão">
    {{ .Field }}
  </td>
  <td class="py-3 px-4 text-left font-mono" data-label="Placa">
    {{ .Vehicle }}
  </td>
  <td class="py-3 px-4 text-left font-bold" data-label="Peso Líquido" id="netWeight">
    {{ .NetWeight }}
  </td>
  <td id="arrivalDate" class="py-3 px-4 text-left" data-label="Data de Recebimento">
    {{ .ArrivalDate }}
  </td>
  <td class="py-3 px-4 text-left" data-label="Ações">
    <div class="flex items-center justify-end lg:justify-start gap-2 *:size-5">
      <button type="button" id="{{ .Id }}" data-pdf="entry" title="PDF de Entrada" class="icon-btn size-5">
        <iconify-icon icon="mdi:file-pdf-box" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-get="/entry/form/{{ .Id }}" hx-target="body" hx-swap="beforeend" title="Editar Entrada"
        class="icon-btn">
        <iconify-icon icon="mdi:pencil" class="text-xl"></iconify-icon>
      </button>
      <button type="button" hx-trigger="confirmed" hx-delete="/entry/{{ .Id }}" hx-target="#entry-{{ .Id }}"
        hx-swap="delete" title="Excluir Entrada" class="icon-btn" data-delete-text="Deseja excluir o romaneio de entrada {{ .Id }} ?">
        <iconify-icon icon="mdi:trash-can" class="text-xl"></iconify-icon>
      </button>
    </div>
  </td>
</tr>
{{ end }}
