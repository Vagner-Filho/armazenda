{{ block "entry-draft-table" . }}
<table class="w-full">
    <thead
        class="text-xs sm:text-base whitespace-nowrap bg-sky-50/15 backdrop-blur-sm border-b border-sky-50/40 text-white/90 uppercase hidden md:table-header-group">
        <tr>
            <th class="py-3 px-4 text-left">
                Nome
            </th>
            <th class="py-3 px-4 text-left">
                Talhão
            </th>
            <th class="py-3 px-4 text-left">
                Origem
            </th>
            <th class="py-3 px-4 text-left">
                Safra
            </th>
            <th class="py-3 px-4 text-left">
                Placa
            </th>
            <th class="py-3 px-4 text-left">
                Tara
            </th>
            <th class="py-3 px-4 text-left">
                Ações
            </th>
        </tr>
    </thead>
    <tbody id="entries-draft-table-body" class="text-white/80">
        {{ range . }}
        {{ template "entry-draft-list-item" . }}
        {{ end }}
    </tbody>
</table>
{{ end }}
