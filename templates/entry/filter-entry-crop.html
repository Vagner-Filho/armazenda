{{ block "filter-entry-crop" . }}
<fieldset class="filter-card">
    <legend class="w-full text-center">
        <label for="crop-filter" class="font-medium text-sm text-inherit">
            Safra
        </label>
    </legend>
    <select name="crop" id="crop-filter" class="w-full text-sm peer">
        <option value="">
            Nenhuma
        </option>
        {{ range . }}
        {{ template "crop-option" . }}
        {{ else }}
        <option value="-1">
            Nenhuma safra encontrada
        </option>
        {{ end }}
    </select>
</fieldset>
{{ end }}
