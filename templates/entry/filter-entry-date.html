{{ define "filter-entry-date" }}
<fieldset class="filter-card">
    <legend class="w-full text-center text-xs font-medium uppercase tracking-wider text-white/70">
        Data de recebimento
    </legend>
    <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
        <input type="datetime-local" id="arrivalMin" name="arrivalDateMin" class="text-sm peer w-full bg-white/10 text-white border-white/20" aria-placeholder="Data de recebimento mínimo" />
        <label for="arrivalMin" class="px-2 text-xs text-white/80 peer-focus:text-green-400">de:</label>
    </div>
    <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
        <input type="datetime-local" id="arrivalMax" name="arrivalDateMax" class="text-sm peer w-full bg-white/10 text-white border-white/20" aria-placeholder="Data de recebimento máximo" />
        <label for="arrivalMax" class="px-2 text-xs text-white/80 peer-focus:text-green-400">até:</label>
    </div>
</fieldset>
{{ end }}
