{{ block "filter-entry-vehicle" . }}
<fieldset class="filter-card">
  <legend class="w-full text-center">
    <label for="vehicle-filter" class="font-medium text-sm text-white/90">
      Veículo
    </label>
  </legend>
  <select name="vehiclePlate" id="vehicle-filter" class="w-full text-sm peer bg-slate-800/80 text-white/90 border-white/20">
    <option value="" selected>
      Nenhum
    </option>
    {{ range . }}
        {{ template "vehicle-option" . }}
        {{ else }}
    <option value="-1">
      Nenhum veículo encontrado
    </option>
    {{ end }}
  </select>
</fieldset>
{{ end }}
