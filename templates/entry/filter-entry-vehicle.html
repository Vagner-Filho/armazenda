{{ block "filter-entry-vehicle" . }}
<fieldset class="filter-card">
  <legend class="w-full text-center">
    <label for="vehicle-filter" class="text-xs font-medium uppercase tracking-wider text-white/70">
      Veículo
    </label>
  </legend>
  <select name="vehiclePlate" id="vehicle-filter" class="w-full text-sm peer bg-white/10 text-white border-white/20">
    <option value="" selected>
      Nenhum
    </option>
    {{ range . }}
        {{ template "vehicle-option" . }}
        {{ else }}
    <option value="-1">
      Nenhum veículo encontrado
    </option>
    {{ end }}
  </select>
</fieldset>
{{ end }}
