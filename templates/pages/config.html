<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Configurações - Armazenda</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
  </head>
  <body class="bg-sky-50">
    {{ template "navbar" . }}
    {{ template "menu" "config" }}
    <section class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Configurações da Fazenda</h1>
        <form action="/config" method="post">
            {{ with .Farm }}
            <input type="hidden" name="id" value="{{ .Id }}">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Nome da Fazenda</label>
                <input type="text" name="name" id="name" value="{{ .Name }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="street" class="block text-sm font-medium text-gray-700">Rua</label>
                <input type="text" name="street" id="street" value="{{ .Street }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="city" class="block text-sm font-medium text-gray-700">Cidade</label>
                <input type="text" name="city" id="city" value="{{ .City }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="state" class="block text-sm font-medium text-gray-700">Estado</label>
                <input type="text" name="state" id="state" value="{{ .State }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="cep" class="block text-sm font-medium text-gray-700">CEP</label>
                <input type="text" name="cep" id="cep" value="{{ .Cep }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="humidityDiscount" class="block text-sm font-medium text-gray-700">Desconto de Umidade (%)</label>
                <input type="number" step="0.01" name="humidityDiscount" id="humidityDiscount" value="{{ .HumidityDiscount }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>
            {{ end }}
            <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Salvar
            </button>
        </form>
    </section>
  </body>
</html>
