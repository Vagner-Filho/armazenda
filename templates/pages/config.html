<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Configurações - Armazenda</title>
    <script src="/public/assets/js/htmx.min.js"></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
</head>
<body class="main-bg">
    {{ template "navbar" . }}
    {{ template "menu" "config" }}
    <section class="mt-14 lg:mt-20 mb-4 lg:pl-12 px-2 max-w-screen-xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-xl lg:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
                Configurações
            </h1>
            <p class="text-sm text-white/90 mt-2">
                Gerencie as informações da sua fazenda, endereço e contato.
            </p>
        </header>
        <div class="glass-panel rounded-xl shadow-center p-4 mb-8">
            {{ template "config-form" . }}
        </div>
        <div class="my-8 border-b-2 border-white/20"></div>
        <div hx-get="/user/pending" hx-trigger="load"></div>
        <div hx-get="/users" hx-trigger="load"></div>
    </section>
    <script type="module">
        import {removeEmptyFields} from "/public/assets/js/form.js";
        import {setupCepListener} from "/public/assets/js/address.js";

        document.body.addEventListener('htmx:configRequest', function (evt) {
            evt.detail.parameters = removeEmptyFields(evt.detail.parameters);
        });

        setupCepListener('cep', 'street', 'neighborhood', 'city', 'state');
    </script>
</body>
</html>
