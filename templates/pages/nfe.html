<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>NF-e - Armazenda</title>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/static/htmx.min.js.gz" defer></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
</head>
<body class="main-bg">
    {{ template "navbar" . }}
    {{ template "menu" (dict "page" "nfe" "CSPNonce" .CSPNonce) }}
    <section class="content-container">
        <header class="text-center mb-4 2xl:mb-8">
            <h1 class="text-xl 2xl:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
                Notas Fiscais Eletrônicas
            </h1>
            <p class="text-sm text-white/90 mt-2">
                Gerencie suas NF-e emitidas.
            </p>
        </header>
        <div hx-get="/nfe/list" hx-trigger="load" hx-swap="outerHTML">
            <p class="text-white/50 text-sm text-center">Carregando...</p>
        </div>
    </section>
</body>
</html>
