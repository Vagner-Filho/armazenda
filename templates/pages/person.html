<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Pessoa - Armazenda</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
    <script type="module" src="/public/assets/js/getEntryPdf.js"></script>
    <script type="module" src="/public/assets/js/getDeparturePdf.js"></script>
  </head>
  <body class="bg-sky-50">
  {{ template "navbar" }}
  {{ template "menu" "pessoa" }}
  <section class="mt-20 pl-12 sm:pl-2 px-2 max-w-screen-xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-700">
        Cadastro de Pessoas
      </h1>
      <p class="text-gray-600 mt-2">
        Gerencie as pessoas cadastradas no sistema.
      </p>
    </header>

    <div class="bg-white shadow-md rounded-lg p-4">
      <div class="flex justify-end mb-4">
        <button id="form" type="button" class="add-btn flex items-center gap-1" hx-get="/person/form"
          hx-target="body" hx-swap="beforeend">
          <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
          Nova Pessoa
        </button>
      </div>

      <div class="overflow-hidden">
        <table class="w-full">
          <thead
            class="text-xs sm:text-base whitespace-nowrap bg-gray-100 text-gray-600 uppercase hidden md:table-header-group"
            id="people-header">
            <tr>
              <th class="py-3 px-4 text-left">TIPO</th>
              <th class="py-3 px-4 text-left">NOME</th>
              <th class="py-3 px-4 text-left">DOCUMENTO</th>
              <th class="py-3 px-4 text-left">INSCRIÇÃO ESTADUAL</th>
              <th class="py-3 px-4 text-left">AÇÕES</th>
            </tr>
          </thead>
          <tbody class="overflow-x-auto text-gray-700" id="people-rows">
            {{ range .People }}
            {{ template "person-list-item" . }}
            {{ end }}
          </tbody>
        </table>
      </div>
    </div>
  </section>
</body>
</html>
