<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Romaneio - Armazenda</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
    <script type="module" src="/public/assets/js/getEntryPdf.js"></script>
    <script type="module" src="/public/assets/js/getDeparturePdf.js"></script>
  </head>
  <body class="bg-sky-50">
    {{ template "navbar" }}
  {{ template "menu" "romaneio" }}
    <section class="mt-20 pl-12 sm:pl-2 px-2 max-w-screen-xl mx-auto">
      <header>
        <h1 class="text-center text-xl">
          CONTROLE DE ROMANEIO
        </h1>
      </header>
      <div class="flex items-center justify-center w-full py-2 font-bold tracking-wide">
        <button type="button" id="show-entry-manifest" class="h-8 px-2 text-xs md:text-base rounded-md rounded-r-none ring-1 ring-green-400 text-white bg-green-400 transition-colors duration-300" hx-trigger="click" hx-get="/entry/list" hx-target="#content-container" onclick="handleShowDeparture('button#show-entry-manifest', 'button#show-departure-manifest')">
          ENTRADA
        </button>
        <div class="h-8 w-[2px] bg-green-400">
        </div>
        <button type="button" id="show-departure-manifest" class="h-8 px-2 text-xs md:text-base rounded-md rounded-l-none ring-1 ring-green-400 text-green-400 transition-colors duration-300" hx-trigger="click" hx-get="/departure/list" hx-target="#content-container" onclick="handleShowDeparture('button#show-departure-manifest', 'button#show-entry-manifest')">
          SAÍDA
        </button>
      </div>
      <div id="content-container">
        {{ template "entry-content" . }}
      </div>
    </section>
  </body>
</html>
<script type="module">
  function handleShowDeparture(selectorAdd, selectorRemove) {
    const elToAddClass = document.querySelector(selectorAdd);
    if (elToAddClass) {
      elToAddClass.classList.add('bg-green-400', 'text-white')
      elToAddClass.classList.remove('text-green-400')
    }
    const elToRemoveClass = document.querySelector(selectorRemove);
    if (elToRemoveClass) {
      elToRemoveClass.classList.remove('bg-green-400', 'text-white')
      elToRemoveClass.classList.add('text-green-400')
    }
  }
  window.handleShowDeparture = handleShowDeparture
</script>
<style>
@media screen and (max-width: 600px) {
  table {
    border: 0;
  }

  table caption {
    font-size: 1.3em;
  }

  table thead {
    border: none;
    clip: rect(0 0 0 0);
    height: 1px;
    margin: -1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    width: 1px;
  }
 
  table tr {
    border-bottom: 3px solid #ddd;
    display: block;
    margin-bottom: .625em;
  }
 
  table td {
    border-bottom: 1px solid #ddd;
    display: block;
    font-size: .8em;
    text-align: right;
  }
 
  table td::before {
    /*
    * aria-label has no advantage, it won't be read inside a table
    content: attr(aria-label);
    */
    content: attr(data-label);
    float: left;
    font-weight: bold;
    text-transform: uppercase;
  }
 
  table td:last-child {
    border-bottom: 0;
  }
}
</style>
