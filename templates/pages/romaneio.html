<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Romaneio - Armazenda</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
    <script type="module" src="/public/assets/js/getEntryPdf.js"></script>
    <script type="module" src="/public/assets/js/getDeparturePdf.js"></script>
  </head>
  <body class="bg-sky-50">
    {{ template "navbar" }}
  {{ template "menu" "romaneio" }}
    <section class="mt-14 lg:mt-20 mb-4 pl-12 sm:pl-2 px-2 max-w-screen-xl mx-auto">
      <header class="text-center mb-8">
        <h1 class="text-xl lg:text-3xl font-bold text-slate-700">
          Controle de Romaneios
        </h1>
        <p class="text-sm text-gray-600 mt-2">
          Gerencie as entradas e saídas de cargas do seu armazém.
        </p>
      </header>
      <div class="max-w-md mx-auto mb-8">
        <div class="bg-gray-200 rounded-lg p-1 flex" id="type-toggler">
          <button type="button" id="show-entry-manifest" class="flex-1 py-2 px-4 rounded-lg flex items-center justify-center gap-2 bg-white text-gray-800 shadow transition-colors duration-300" hx-trigger="click" hx-get="/entry/list" hx-target="#content-container" onclick="handleToggle(this)">
            <iconify-icon icon="mdi:arrow-bottom-left-thick" class="text-xl"></iconify-icon>
            <span class="font-semibold">Entrada</span>
          </button>
          <button type="button" id="show-departure-manifest" class="flex-1 py-2 px-4 rounded-lg flex items-center justify-center gap-2 text-gray-500 transition-colors duration-300" hx-trigger="click" hx-get="/departure/list" hx-target="#content-container" onclick="handleToggle(this)">
            <iconify-icon icon="mdi:arrow-top-right-thick" class="text-xl"></iconify-icon>
            <span class="font-semibold">Saída</span>
          </button>
        </div>
      </div>
      <div id="content-container">
        {{ template "entry-content" . }}
      </div>
    </section>
  </body>
</html>
<script type="module">
  function handleToggle(clickedButton) {
    const buttons = clickedButton.parentElement.querySelectorAll('button');
    buttons.forEach(button => {
      button.classList.remove('bg-white', 'text-gray-800', 'shadow');
      button.classList.add('text-gray-500');
    });
    clickedButton.classList.add('bg-white', 'text-gray-800', 'shadow');
    clickedButton.classList.remove('text-gray-500');
  }
  window.handleToggle = handleToggle
</script>
<style>
@media screen and (max-width: 600px) {
  table {
    border: 0;
  }

  table caption {
    font-size: 1.3em;
  }

  table thead {
    border: none;
    clip: rect(0 0 0 0);
    height: 1px;
    margin: -1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    width: 1px;
  }
 
  table tr {
    border-bottom: 3px solid #ddd;
    display: block;
    margin-bottom: .625em;
  }
 
  table td {
    border-bottom: 1px solid #ddd;
    display: block;
    font-size: .8em;
    text-align: right;
  }
 
  table td::before {
    /*
    * aria-label has no advantage, it won't be read inside a table
    content: attr(aria-label);
    */
    content: attr(data-label);
    float: left;
    font-weight: bold;
    text-transform: uppercase;
  }
 
  table td:last-child {
    border-bottom: 0;
  }
}
</style>
