<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Análise - Armazenda</title>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/static/htmx.min.js.gz" defer></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/weight.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/stats.js"></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1"></script>
  </head>
  <body class="main-bg">
    {{ template "navbar" . }}
    {{ template "menu" (dict "page" "analise" "CSPNonce" .CSPNonce "TierKey" .TierKey) }}
    <section class="content-container">
      <header class="text-center mb-4 2xl:mb-8">
        <h1 class="text-xl 2xl:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
          Análise
        </h1>
        <p class="text-sm text-white/90 mt-2">
          Estude a eficiência operacional do seu armazém.
        </p>
      </header>
      <div class="glass-panel rounded-xl shadow-center p-4 overflow-y-auto default-style-scroll">
        <details id="analise-filters" class="group w-full mb-4">
          <summary class="outline-none list-none flex items-center justify-between px-3 py-2 group-open:mb-2 cursor-pointer hover:bg-gray-800 rounded-xl">
            <span class="text-lg font-medium text-gray-200">Filtros</span>
            <div class="flex items-center gap-2">
              <button type="submit" form="analise-filters-form" class="hidden group-open:flex items-center gap-2 px-3 py-1.5 bg-green-600 text-white rounded-md hover:bg-green-700 transition-all duration-200 text-sm font-medium" title="Filtrar">
                <iconify-icon icon="mingcute:filter-line" width="18" height="18"></iconify-icon>
                <span>Filtrar</span>
              </button>
              <button type="button" hx-trigger="click" hx-get="/analise/filters" hx-target="form#analise-filters-form" hx-swap="outerHTML" class="hidden group-open:flex items-center gap-2 px-3 py-1.5 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-all duration-200 text-sm font-medium" title="Limpar Filtro" id="clear-filter">
                <iconify-icon icon="hugeicons:clean" width="18" height="18"></iconify-icon>
                <span>Limpar</span>
              </button>
              <svg class="w-5 h-5 text-gray-500 transform transition-transform duration-200 group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </div>
          </summary>
          <div class="p-4 border-t border-gray-500">
            {{ template "analise-filter-form" . }}
          </div>
        </details>
        <div id="analise-content">
          {{ template "analise-content" . }}
        </div>
      </div>
    </section>
    <script nonce="{{ .CSPNonce }}" type="module">
      import { setupProductStackedChart } from "/public/assets/js/chart.js";
      import { setupClearFilter } from "/public/assets/js/filter.js";

      document.body.addEventListener('htmx:afterSwap', function(evt) {
        const container = evt.detail.elt;
        if (container && container.id === "field-product-charts-container") {
          const nominalLabels = JSON.parse(container.dataset.nominalLabels);
          const nominalDatasets = JSON.parse(container.dataset.nominalDatasets);
          const relativeLabels = JSON.parse(container.dataset.relativeLabels);
          const relativeDatasets = JSON.parse(container.dataset.relativeDatasets);

          setupProductStackedChart('fieldProductVolumeChart', 'Volume por Talhão e Produto', nominalLabels, nominalDatasets);
          setupProductStackedChart('fieldProductivityChart', 'Produtividade por Talhão e Produto (Peso Líquido / hectare)', relativeLabels, relativeDatasets);
        }
      });

      setupClearFilter('button#clear-filter', 'button[form="analise-filters-form"]');
    </script>
  </body>
</html>
