<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Análise - Armazenda</title>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/js/htmx.min.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/weight.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/stats.js"></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="main-bg">
    {{ template "navbar" . }}
    {{ template "menu" (dict "page" "analise" "CSPNonce" .CSPNonce) }}
    <section class="mt-14 lg:mt-20 mb-4 lg:pl-12 px-2 max-w-screen-xl mx-auto">
      <header class="text-center mb-8">
        <h1 class="text-xl lg:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
          Análise
        </h1>
        <p class="text-sm text-white/90 mt-2">
          Gere relatórios detalhados sobre as operações do seu armazém.
        </p>
      </header>
      <div class="glass-panel rounded-xl shadow-center p-4 mb-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div hx-get="/stats/top-supplier" hx-trigger="load" hx-swap="outerHTML"></div>
          <div hx-get="/stats/top-buyer" hx-trigger="load" hx-swap="outerHTML"></div>
          <div hx-get="/stats/most-frequent-supplier" hx-trigger="load" hx-swap="outerHTML"></div>
          <div hx-get="/stats/best-quality-supplier" hx-trigger="load" hx-swap="outerHTML"></div>
          <div hx-get="/stats/worst-quality-supplier" hx-trigger="load" hx-swap="outerHTML"></div>
          <div hx-get="/analise/most-productive-field" hx-trigger="load" hx-swap="outerHTML"></div>
        </div>
      </div>
    </section>
  </body>
</html>
