<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <title>Rascunhos de NF-e - Armazenda</title>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/static/htmx.min.js.gz" defer></script>
    <script nonce="{{ .CSPNonce }}" src="/public/assets/js/sweetalert2.min.js"></script>
    <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
    <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
</head>
<body class="main-bg">
    {{ template "navbar" . }}
    {{ template "menu" (dict "page" "nfe-rascunhos" "CSPNonce" .CSPNonce "TierKey" .TierKey) }}
    <section class="content-container overflow-y-auto">
        <header class="text-center mb-4 2xl:mb-8">
            <h1 class="text-xl 2xl:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
                Rascunhos de NF-e
            </h1>
            <p class="text-sm text-white/90 mt-2">
                Acelere a emissão de NF-e avulsa a partir de um rascunho.
            </p>
        </header>

        <div class="glass-panel rounded-xl overflow-hidden p-4">
            <div class="flex justify-end items-center mb-4">
                <button id="form" type="button"
                    class="btn-shape text-white/60 hover:text-white hover:bg-slate-500 focus:text-white focus:bg-slate-500 ring ring-inset ring-slate-500 transition-colors duration-300 ease-in-out flex items-center gap-1"
                    hx-get="/nfe/rascunho/form" hx-target="body" hx-swap="beforeend" data-test-id="novo-rascunho">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z" />
                    </svg>
                    Novo Rascunho
                </button>
            </div>
            <main id="rascunho-list" hx-get="/nfe/rascunho/list" hx-trigger="load" hx-swap="innerHTML">
                <div class="flex justify-center items-center p-4">
                    <img src="/public/assets/static/spinner.svg" class="animate-spin h-8 w-8 text-white/60" alt="Carregando...">
                </div>
            </main>
        </div>
    </section>
</body>
</html>
