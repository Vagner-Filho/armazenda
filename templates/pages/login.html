<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <title>Login - Armazenda</title>
    <script src="/public/assets/js/htmx.min.js"></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
  </head>
  <body class="h-screen flex justify-center items-center">
    <div class="liquid-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <main class="glass-card w-full max-w-md p-8 md:p-12 flex flex-col items-center z-10 space-y-6">
      <h2 class="text-3xl font-extrabold text-white tracking-wide drop-shadow-lg font-[Noto_Sans]">Login</h2>
      <form hx-post="/login" hx-target="#error-indicator-space" class="space-y-6 w-full">
        {{ template "cpf-field" "glass-input h-12" }}
        <div class="flex flex-col space-y-2">
          <label for="password" class="px-2 text-inherit text-xs font-bold uppercase tracking-wide">Senha</label>
          <input type="password" id="password" name="passwd" required aria-placeholder="senha" placeholder="*********" class="w-full px-2 glass-input h-12">
        </div>
        <button type="submit" class="w-full py-3 glass-btn glass-btn-primary rounded-full text-lg uppercase tracking-wider font-bold shadow-lg">Entrar</button>
      </form>
      <div class="flex flex-col gap-2 w-full">
        <a href="/auth/google/login" class="glass-btn w-full flex justify-center items-center gap-2 hover:bg-gray-50 text-gray-700 font-semibold py-2 px-4 rounded shadow-sm transition-all duration-300">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </a>
        <a href="/auth/microsoft/login" class="glass-btn w-full flex justify-center items-center gap-2 hover:bg-gray-50 text-gray-700 font-semibold py-2 px-4 rounded shadow-sm transition-all duration-300">
          <svg class="w-5 h-5" viewBox="0 0 21 21">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          Entrar com Microsoft
        </a>
      </div>
      <p class="text-sm text-center pt-4">
        Novo por aqui?
        <button type="button" class="hover:underline focus:underline transition-all duration-300 ease-in-out font-bold" hx-trigger="click" hx-get="/user/form" hx-target="body" hx-swap="beforeend">Crie uma conta!</button>
      </p>
      <div id="error-indicator-space" class="flex justify-center">
        <!-- Message error login -->
      </div>
    </main>
  </body>
  <script>
    document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', function () {
      const errorMsg = document.getElementById('error-msg');
      if (errorMsg) {
        errorMsg.remove();
      }
    });
  });
  </script>
  <style>
    body {
    background-color: #7dd3fc;
    color: white;
    overflow-x: hidden;
  }

  .liquid-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: -1;
    background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 40%, #a3e635 100%);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.7;
  }

  .blob-1 {
    top: -10%;
    left: -10%;
    width: 60vmax;
    height: 60vmax;
    background: #0ea5e9;
  }

  .blob-2 {
    bottom: -5%;
    right: -5%;
    width: 55vmax;
    height: 55vmax;
    background: #22c55e;
  }

  .blob-3 {
    bottom: 10%;
    left: 10%;
    width: 45vmax;
    height: 40vmax;
    background: #92400e;
    opacity: 0.5;
  }

  .blob-4 {
    position: absolute;
    height: 70vmax;
    width: 50px;
    background-color: brown;
    bottom: -30px;
    right: 30%;
    filter: blur(35px);
    opacity: 1;
    border-radius: 0;
    transform: rotate(35deg);
    transform-origin: bottom;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    border-radius: 24px;
  }

  .glass-input {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    border-radius: 12px;
    transition: all 0.3s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
  }

  .glass-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .glass-input:focus {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.5);
    outline: none;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
  }

  .glass-input:-webkit-autofill,
  .glass-input:-webkit-autofill:hover,
  .glass-input:-webkit-autofill:focus,
  .glass-input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.1) inset !important;
    -webkit-text-fill-color: white !important;
    transition: background-color 5000s ease-in-out 0s;
  }

  .glass-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
  }

  .glass-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
  }

  .glass-btn-primary {
    background: rgba(22, 163, 74, 0.5);
    border-color: rgba(255, 255, 255, 0.3);
    color: #ffffff;
  }

  .glass-btn-primary:hover {
    background: rgba(22, 163, 74, 0.7);
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
  }
  </style>
</html>
