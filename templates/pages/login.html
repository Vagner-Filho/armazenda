<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <title>Login - Armazenda</title>
    <script src="/public/assets/js/htmx.min.js"></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
  </head>
  <body class="bg-gray-200 h-screen flex justify-center items-center">
    <main class="bg-white p-8 pb-4 w-96 rounded shadow-lg">
      <h2 class="text-2xl font-bold mb-2 text-center text-green-500">Login</h2>
      <form hx-post="/login" hx-target="#error-indicator-space">
        {{ template "cpf-field" }}
        <div class="mb-4 flex flex-col-reverse mt-2">
          <input type="password" id="password" name="passwd" required aria-placeholder="senha" placeholder="*********" class="w-full px-2 peer">
          <label for="password" class="px-2 label-peer">Senha</label>
        </div>
        <button type="submit" class="w-full add-btn">Entrar</button>
      </form>
      <div class="mt-4">
        <a href="/auth/google/login" class="w-full flex justify-center items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-2 px-4 rounded shadow-sm transition-all duration-300">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </a>
      </div>
      <p class="text-sm text-center text-gray-500 pt-4">
        Novo por aqui?
        <button type="button" class="hover:text-green-600 focus:text-green-600 transition-all duration-300 ease-in-out hover:font-bold focus:font-bold" hx-trigger="click" hx-get="/user/form" hx-target="body" hx-swap="beforeend">Crie uma conta!</button>
      </p>
      <div id="error-indicator-space" class="flex justify-center">
        <!-- Message error login -->
      </div>
    </main>
  </body>
  <script>
    document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', function () {
      const errorMsg = document.getElementById('error-msg');
      if (errorMsg) {
        errorMsg.remove();
      }
    });
  });
  </script>
</html>
