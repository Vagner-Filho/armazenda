<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900&display=swap" rel="stylesheet">
  <link href="/public/assets/static/css/output.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
  <link rel="manifest" href="/public/assets/manifest.json">
  <title>Produtos - Armazenda</title>
  <script nonce="{{ .CSPNonce }}" src="/public/assets/static/htmx.min.js.gz" defer></script>
  <script nonce="{{ .CSPNonce }}" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
  <script nonce="{{ .CSPNonce }}" type="module" src="/public/assets/js/toast.js"></script>
</head>

<body class="main-bg">
  {{ template "navbar" . }}
  {{ template "menu" (dict "page" "produto" "CSPNonce" .CSPNonce "TierKey" .TierKey) }}
  <section class="content-container">
    <header class="text-center mb-4 2xl:mb-8">
      <h1 class="text-xl 2xl:text-3xl font-bold text-white font-[Noto_Sans] drop-shadow-lg">
        Cadastro de Produtos
      </h1>
      <p class="text-sm text-white/90 mt-2">
        Gerencie os produtos do seu armazém.
      </p>
    </header>
    <div class="glass-panel rounded-xl p-4 overflow-y-auto" id="product-content">
      <div class="flex justify-end mb-4">
        <button id="form" type="button" class="primary-glass-btn flex items-center gap-1" hx-get="/produto/form"
          hx-target="body" hx-swap="beforeend">
          <iconify-icon icon="ic:baseline-add-circle"></iconify-icon>
          Novo Produto
        </button>
      </div>
      <div id="products-table">
        <div class="overflow-hidden">
          <table class="responsive-table">
            <thead
              class="border-b border-white/10 text-xs text-gray-400 uppercase tracking-wider *:font-medium whitespace-nowrap hidden md:table-header-group"
              id="products-header">
              <tr>
                <th class="py-3 px-4 text-left">NOME</th>
                <th class="py-3 px-4 text-left">NCM</th>
                <th class="py-3 px-4 text-left">ORIGEM</th>
                <th class="py-3 px-4 text-left">AÇÕES</th>
              </tr>
            </thead>
            <tbody class="overflow-x-auto text-white/80" id="products-rows">
              {{ range .Products }}
              {{ template "product-list-item" . }}
              {{ end }}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
