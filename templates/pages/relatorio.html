<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/public/assets/static/css/output.css" rel="stylesheet">
    <title>Relatório</title>
    <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js" defer></script>
    <script type="module" src="/public/assets/js/toast.js"></script>
    <script type="module" src="/public/assets/js/getEntryPdf.js"></script>
    <script type="module" src="/public/assets/js/getDeparturePdf.js"></script>
  </head>
  <body class="bg-sky-50">
    {{ template "navbar" }}
    <div class="fixed top-0 left-0 h-dvh w-60 bg-green-400 flex flex-col" role="menu">
      <a href="/pessoa">
        Pessoa
      </a>
      <a href="/relatorio">
        Relatório
      </a>
      <a href="/romaneio">
        Romaneio
      </a>
    </div>
    <section class="mt-20 px-2 max-w-screen-xl mx-auto">
      <form id="filters" hx-post="/report/filter" hx-target="#report-content">
        <select name="person" id="person-selector" class="appearance-none px-2 peer">
          <option value="1">
            Pessoa X
          </option>
        </select>
        {{ template "filter-entry-grain" }}
        <fieldset class="grid grid-cols-2 gap-1">
          <legend class="w-full text-center font-medium hidden sm:block text-xs sm:text-sm">
            Data da operação
          </legend>
          <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
            <input type="datetime-local" id="startDate" name="startDate" class="text-sm peer w-full" aria-placeholder="Data Inicial">
            <label for="startDate" class="px-2 text-xs label-peer sm:hidden">Data de:</label>
            <label for="startDate" class="px-2 text-xs label-peer hidden sm:block">de:</label>
          </div>
          <div class="flex flex-col-reverse w-full sm:max-w-40 lg:max-w-44">
            <input type="datetime-local" id="endDate" name="endDate" class="text-sm peer w-full" aria-placeholder="Data Final">
            <label for="endDate" class="px-2 text-xs label-peer sm:hidden">Data até:</label>
            <label for="endDate" class="px-2 text-xs label-peer hidden sm:block">até:</label>
          </div>
        </fieldset>
        {{ template "filter-entry-netweight" }}
      {{ template "filter-entry-vehicle" .Vehicles }}
        <button type="submit">Filtrar</button>
      </form>
      <div class="flex flex-col w-full" id="report-header">
        <div class="w-full flex justify-between bg-slate-200 uppercase text-lg px-2">
          <div>
            Romaneio
          </div>
          <div>
            Operação
          </div>
          <div>
            Produto
          </div>
          <div>
            Veículo
          </div>
          <div>
            Peso Líquido
          </div>
          <div>
            Data Operação
          </div>
        </div>
      </div>
      {{ template "report-content" . }}
    </section>
  </body>
</html>
