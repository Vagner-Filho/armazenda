# Test Database for E2E Tests
#
# IMPORTANT: Keep the PostgreSQL version in sync with your production/development database.
# Current version: postgres:16-alpine
#
# Usage:
#   Automatically started/stopped by Playwright global setup/teardown
#   Or manually: docker compose -f docker-compose.test.yml up -d
#                docker compose -f docker-compose.test.yml down -v

services:
  test-db:
    image: postgres:16-alpine
    container_name: armazenda-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: armazenda_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d armazenda_test"]
      interval: 0.5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
